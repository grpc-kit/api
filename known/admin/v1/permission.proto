syntax = "proto3";

// 根据具体的微服务名称做更改
package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

import "google/protobuf/field_mask.proto";

import "known/admin/v1/admin.common.proto";

message ListPermissionsRequest {
  // 父资源名称，用于限定范围。
  // 格式示例: "organizations/123" 或 "projects/456"。
  string parent = 1;

  // 每页返回的最大权限数。
  // - structure=STRUCTURE_UNSPECIFIED 或 STRUCTURE_FLAT：默认 20，最大 100。
  // - structure=STRUCTURE_TREE 或 STRUCTURE_TREE_EXPANDED：默认 1000，最大 5000。
  int32 page_size = 2;

  oneof pagination {
    // Cursor-based 分页
    string page_token = 3;

    // Offset-based 分页
    int32 offset = 4;
  }

  View view = 5;
  Structure structure = 6;

  // 过滤条件，采用 AIP-160 定义的标准 filter 语法。
  // 示例: `code="permission_001" AND policy_id=1`
  string filter = 7;

  // 排序规则，指定结果返回顺序。
  // 格式: "field_name [asc|desc], ..."。
  // 示例: "create_time desc, code asc"
  // AIP-132: order_by 是可选字段。
  string order_by = 8;

  // TODO；以下将来会统一使用 filter 参数实现过滤
  int64 policy_id = 9;
}

message ListPermissionsResponse {
  repeated Permission permissions = 1;

  // 用于获取下一页结果的 token。
  // - 如果为空，表示没有更多结果。
  // - 客户端不需要理解其内容，只需原样传回。
  // AIP-132: 必须字段。
  string next_page_token = 2;

  // 符合条件的权限总数。
  // - 常用于前端分页控件。
  // - 注意：可能会因性能原因而近似。
  // AIP-132: total_size 是可选字段。
  int32 total_size = 3;
}

message CreatePermissionRequest {
  /*
  {
    "code": "manage-users",
    "display_name": "管理用户列表",
    "policy": {
      "id": "10"
    },
    "bindings": [
      {
        "resource_scope_id": 1,
        "is_recursive": true
      }
    ],
    "description": "允许查看和管理用户列表"
  }

  注意：code 为可选字段，如客户端未提供，服务端将自动生成 12 位随机编码。
  如提供，需符合 code 规范：以小写字母开头，仅 [a-z0-9.:-]，长度 2-32，不允许连续分隔符（如 "--"、".."、"::"）。
  */
  Permission permission = 1;
}

message UpdatePermissionRequest {
  Permission permission = 1;

  google.protobuf.FieldMask update_mask = 2;
}

message DeletePermissionRequest {
  int64 id = 1;
}

message GetPermissionRequest {
  int64 id = 1;
}
