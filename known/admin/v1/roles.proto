  // 每页返回的最大权限数。
  // - 如果未指定，则使用服务端默认值 (如 20)。
  // - 最大不超过 100 (超出时强制截断)。
  int32 page_size = 2;

  oneof pagination {
    // Cursor-based 分页
    string page_token = 3;

    // Offset-based 分页
    int32 offset = 4;
  }

  View view = 5;

  // 过滤条件，采用 AIP-160 定义的标准 filter 语法。
  // 示例: `code="permission_001"`
  string filter = 6;

  // 排序规则，指定结果返回顺序。
  // 格式: "field_name [asc|desc], ..."。
  // 示例: "create_time desc, code asc"
  // AIP-132: order_by 是可选字段。
  string order_by = 7;
}

message ListRoleDataRangesResponse {
  repeated RoleDataRange data_ranges = 1;

  // 用于获取下一页结果的 token。
  // - 如果为空，表示没有更多结果。
  // - 客户端不需要理解其内容，只需原样传回。
  // AIP-132: 必须字段。
  string next_page_token = 2;

  // 符合条件的权限总数。
  // - 常用于前端分页控件。
  // - 注意：可能会因性能原因而近似。
  // AIP-132: total_size 是可选字段。
  int32 total_size = 3;
}