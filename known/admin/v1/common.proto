syntax = "proto3";

// 根据具体的微服务名称做更改
package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

// 引入 google 公共类型
import "google/protobuf/timestamp.proto";

message Leader {
  int32 type = 1;
  int32 user_id = 2;
}

// I18NName 国际化名称
message I18NName {
  string zh_cn = 1;
  string en_us = 2;
  string ja_jp = 3;
}

// Address 用户地址
// https://openid.net/specs/openid-connect-core-1_0.html#AddressClaim
message Address {
  string country = 1;
  string postal_code = 2;
  string region = 3;
  string locality = 4;
  string street_address = 5;
}

// PhoneNumber 手机号，以 E.164 格式存储（E.164 = '+' + 国家码 + 本地号码）总长度 ≤ 15 位，如：+8613812345678
message PhoneNumber {
  // 国家码，字符串更通用，例如 "86", "1"
  string country_code = 1;
  // 本地号码，字符串存储，避免丢失前导零
  string national_number = 2;
}

// Department 组织部门实体，树形结构，一个用户仅可在一个部门内
message Department {
  // ID 实体 ID
  int32 id = 1;
  // ParentID 父 ID，为 0 表示顶级菜单
  int32 parent_id = 2;
  // Name 部门名称
  string name = 3;
  // I18nName 国际化名称
  I18NName i18n_name = 4;
  // OrderWeight 菜单排序权重，数字越小越靠前
  int32 order_weight = 5;
  // Leaders 部门领导列表
  repeated Leader leaders = 6;

  // Children 子部门列表
  repeated Department children = 7;
}

// Resource 资源定义，如：菜单等
message Resource {
  // Type 资源类型
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_DIRECTORY = 1; // 目录，在前端菜单树中，只起到“目录”作用，不直接绑定路由/组件
    TYPE_MENU = 2;      // 菜单
    TYPE_BUTTON = 3;    // 按钮
    TYPE_API = 4;       // API
  }

  // Scope 资源作用域
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    SCOPE_ADMIN = 1; // 后台
    SCOPE_USER = 2;  // 前台
    SCOPE_APP = 3;   // 移动端
  }

  // ID 资源 ID
  int32 id = 1;
  // ParentID 父资源 ID，为 0 表示顶级资源
  int32 parent_id = 2;
  // Name 资源名称
  string name = 3;
  // I18NName 国际化名称
  I18NName i18n_name = 4;
  // OrderWeight 资源排序权重，数字越小越靠前
  int32 order_weight = 5;
  // Type 资源用途，如后台管理员、前台用户、APP 应用
  Type type = 6;
  // Scope 资源作用域
  Scope scope = 7;
  // Enabled 资源是否启用
  bool enabled = 8;
  // Hidden 是否在资源列表中隐藏
  bool hidden = 9;
  // HideChildren 是否在资源列表中隐藏子项
  bool hide_children = 10;

  // Path 资源路径
  string path = 11;
  // Icon 资源图标，通常用于前端展示
  string icon = 12;
  string component = 13;
  repeated string permissions = 14;

  // Children 子资源列表
  repeated Resource children = 15;

  string description = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

// User 用户实体，表示系统中的账号信息
message User {
  // Gender 用户性别
  enum Gender {
    GENDER_UNSPECIFIED = 0;
    GENDER_MALE = 1;        // 男性
    GENDER_FEMALE = 2;      // 女性
    GENDER_OTHER = 3;       // 其他
  }

  // 用户状态（枚举值预计不会太频繁变化）
  // 可以根据业务再增加状态
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 默认值／未知状态
    STATUS_PENDING = 1;      // 待激活／待验证
    STATUS_ACTIVE = 2;       // 正常启用状态
    STATUS_LOCKED = 3;       // 被锁定（如连续密码错误、账号风控等）
    STATUS_DISABLED = 4;     // 禁用（人工停用）
    STATUS_EXPIRED = 5;      // 过期等（订阅过期、账号注销等）
  }

  // 用户的系统类型或所属边界
  enum Type {
    TYPE_UNSPECIFIED = 0;  // 默认值

    // 外部用户 / 业务伙伴
    TYPE_CUSTOMER = 1;     // 前台用户 / 消费者
    TYPE_MERCHANT = 2;     // 商户 / 卖家
    TYPE_SUPPLIER = 3;     // 供应商 / 合作方

    // 内部用户 / 员工
    TYPE_EMPLOYEE = 10;    // 后台用户 / 内部员工
    TYPE_ADMIN = 11;       // 系统管理员

    // 系统账户 (为安全和区分，编号拉开)
    TYPE_SYSTEM = 99;      // 系统集成账户 / 机器人
  }

  // 以下字段为非敏感/可直接输出（适合公开展示或普通资料页）

  // ID 用户 ID，全局唯一标识，使用 int64 序列化为 json 为 string 类型
  int64 id = 1;
  // 用户名，系统登录凭证，必须唯一
  string username = 2;
  // 昵称，用于社交或前端展示
  string nickname = 3;
  // 个人简介或签名
  string profile = 4;
  // 用户头像 URL
  string picture = 5;
  // 个人网站地址
  string website = 6;
  // 时区信息（IANA 时区标识，例如 "Asia/Shanghai"）
  string zoneinfo = 7;
  // 用户偏好的语言与地区（例如 "zh-CN"、"en-US"）
  string locale = 8;

  // 以下字段受限输出（仅本人或具备权限的管理员可见，外部或公共接口谨慎返回）

  // 用户的基础身份类型，后端自动维护更新，非人为更新
  Type type = 9;
  // 用户状态，表示当前账号的生命周期阶段
  Status status = 10;
  // 性别
  Gender gender = 11;
  // 邮箱是否已验证
  bool email_verified = 12;
  // 手机号码是否已验证
  bool phone_number_verified = 13;

  // 创建时间
  google.protobuf.Timestamp created_at = 15;
  // 更新时间
  google.protobuf.Timestamp updated_at = 16;
  // 删除时间
  google.protobuf.Timestamp deleted_at = 17;

  // 敏感字段（默认不直接对外输出，需权限并建议脱敏）

  // 真实姓名，用于实名认证或后台展示
  string realname = 19;
  // 身份证号，用于身份验证（可选）
  string national_id = 20;
  // 邮箱地址
  string email = 21;
  // 出生日期
  google.protobuf.Timestamp birthday = 22;
  // 手机号码
  PhoneNumber phone_number = 23;
  // 地址信息
  Address address = 24;

  // 自定义元数据，用于存储额外的用户信息（如 JSON 字符串）
  map<string, string> metadata = 25;
}

// Role 角色实体，表示用户在系统上的权限和功能
message Role {
  // ID 角色 ID，全局唯一标识
  int32 id = 1;
  // Name 角色名称
  string name = 2;
  // I18NName 角色国际化名称
  I18NName i18n_name = 3;
  // OrderWeight 菜单排序权重，数字越小越靠前
  int32 order_weight = 4;
  string description = 5;
}

// Group 群组实体，表示一类相同维度的用户集合
// 该模型用于描述系统中各类用户分组，支持多维度的用户组织与管理
message Group {
  // 群组状态（枚举值预计不会太频繁变化）
  // 可以根据业务再增加状态
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 默认值／未知状态：系统默认值，通常不直接使用
    STATUS_PENDING = 1;      // 待激活／待验证：创建后等待审核或激活的状态
    STATUS_ACTIVE = 2;       // 正常启用状态：群组正常运行中，可以进行成员管理和权限分配
    STATUS_ARCHIVED = 3;     // 被归档，但可查询：群组不再活跃但保留历史数据，成员不允许变更
    STATUS_DISABLED = 4;     // 禁用，不可查询：群组被临时停用，通常为人工操作结果
  }

  // 群组类型，用于区分不同用途的群组
  enum Type {
    TYPE_UNSPECIFIED = 0;  // 默认值/未指定：系统默认值，通常不直接使用
    TYPE_DEPARTMENT = 1;   // 部门群组：基于组织架构的部门划分，则 external_id 对应 department_id
    TYPE_PROJECT = 2;      // 项目群组：基于项目或任务的临时分组
    TYPE_ROLE = 3;         // 角色群组：基于用户角色或权限的分组
    TYPE_CUSTOM = 4;       // 自定义群组：用户根据特定业务需求自定义的分组
  }

  // ID 群组 ID，全局唯一标识
  int32 id = 1;
  // Name 群组名称，系统内唯一标识符
  string name = 2;
  // Type 群组类型，标识群组的业务用途
  Type type = 3;
  // Status 群组状态，控制群组的可用状态
  Status status = 4;
  // I18NName 群组国际化名称，支持多语言显示
  I18NName i18n_name = 5;
  // OrderWeight 菜单排序权重，数字越小越靠前，用于UI展示排序
  int32 order_weight = 6;
  // ParentID 父群组ID，用于支持群组嵌套，为0表示顶级群组，支持树形组织结构
  int32 parent_id = 7;
  // MaxMembers 群组最大成员数量限制，0表示不限制
  int32 max_members = 8;
  // Metadata 元数据，用于存储自定义属性，支持业务扩展
  map<string, string> metadata = 9;
  // DepartmentID 部门ID，用于与部门的联动
  int32 department_id = 10;
  // ExternalID 外部系统ID，用于与外部系统集成，实现跨系统用户组同步
  string external_id = 11;
  // Description 群组描述，详细说明群组的目的和用途
  string description = 12;
  // CreatedBy 群组创建者/所有者ID，记录创建该群组的用户
  int32 created_by = 13;
  // UpdatedBy 群组最后更新者，记录最后修改该群组的用户
  int32 updated_by = 14;
  // CreatedAt 创建时间，记录群组的创建时间戳
  google.protobuf.Timestamp created_at = 15;
  // UpdatedAt 更新时间，记录群组的最后修改时间戳
  google.protobuf.Timestamp updated_at = 16;
  // DeleteAt 删除时间，用于软删除机制，记录群组标记为删除的时间
  google.protobuf.Timestamp deleted_at = 17;
}

// UserGroup 用户群组关系
// 该模型用于描述用户与群组之间的关联关系，支持多状态管理和角色定义
message UserGroup {
  // 用户在群组中的角色枚举
  enum Role {
    ROLE_UNSPECIFIED = 0;  // 默认值/未指定
    ROLE_OWNER = 1;        // 所有者：拥有群组最高权限
    ROLE_ADMIN = 2;        // 管理员：管理群组成员和基本设置
    ROLE_MEMBER = 3;       // 普通成员：拥有基本访问权限
    ROLE_GUEST = 4;        // 访客：拥有受限访问权限
  }

  // 用户群组关系状态
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 默认值／未知状态：系统默认值，通常不直接使用
    STATUS_PENDING = 1;      // 待激活／待验证：用户申请加入群组等待审批
    STATUS_ACTIVE = 2;       // 正常启用状态：用户正式加入群组
    STATUS_INVITED = 3;      // 被邀请加入：用户收到群组邀请但尚未回应
    STATUS_DISABLED = 4;     // 禁用（人工停用）：用户被临时限制群组权限
    STATUS_REJECTED = 5;     // 被拒绝加入：用户申请或邀请被拒绝
    STATUS_LEFT = 6;         // 已退出：用户主动退出群组
  }

  // ID 用户群组关系 ID，全局唯一标识
  int32 id = 1;
  // UserID 用户 ID，关联用户表
  int32 user_id = 2;
  // Username 用户名，来自用户表
  string username = 3;
  // Nickname 用户昵称，来自用户表
  string nickname = 4;
  // GroupID 群组 ID，关联群组表
  int32 group_id = 5;
  // Role 用户在群组中的角色
  Role member_role = 6;
  // Status 用户群组关系状态
  Status member_status = 7;
  // JoinedAt 用户加入群组的时间
  google.protobuf.Timestamp joined_at = 8;
  // ExpiredAt 关系有效期，用于临时成员管理，0表示永久有效
  google.protobuf.Timestamp expired_at = 9;
  // CreatedBy 创建者 ID，记录创建该关系的用户
  int32 created_by = 10;
  // UpdatedBy 最后更新者 ID，记录最后修改该关系的用户
  int32 updated_by = 11;
  // CreatedAt 创建时间，记录关系的创建时间戳
  google.protobuf.Timestamp created_at = 12;
  // UpdatedAt 更新时间，记录关系的最后修改时间戳
  google.protobuf.Timestamp updated_at = 13;
  // DeletedAt 删除时间，用于软删除机制
  google.protobuf.Timestamp deleted_at = 14;
  // Metadata 元数据，用于存储自定义属性，支持业务扩展
  map<string, string> metadata = 15;
  // Description 群组描述，详细说明群组的目的和用途
  string description = 16;
}

// AuthProvider 身份提供商实体，验证用户登录时使用的第三方服务
message AuthProvider {
  // Type 身份提供商类型
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_LOCAL = 1;
    TYPE_LDAP = 2;
    TYPE_OIDC = 3;
    TYPE_OAUTH2 = 4;
    TYPE_GITHUB = 5;
    TYPE_GOOGLE = 6;
    TYPE_WECHAT = 7;
  }

  // ID 全局唯一标识
  int32 id = 1;
  // Name 身份提供商名称，全局唯一
  string name = 2;
  // Type 身份提供商类型
  Type type = 3;
  // ClientID 身份提供商客户端 ID
  string client_id = 4;
  // ClientSecret 身份提供商客户端密钥
  string client_secret = 5;
  // Enabled 身份提供商是否启用
  bool enabled = 6;
  // RedirectURI 身份提供商回调地址
  string redirect_uri = 7;
  // Scopes 身份提供商授权范围
  string scopes = 8;
  // Issuer 身份提供商标识
  string issuer = 9;
  // 身份提供商授权端点
  string authorization_endpoint = 10;
  // 身份提供商令牌端点
  string token_endpoint = 11;
  // 身份提供商用户信息端点
  string userinfo_endpoint = 12;
}

// Credential 存储凭证信息
message Credential {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_API_KEY = 1;      // 普通 API key
    TYPE_JWT = 2;          // JSON Web Token
    TYPE_JWKS = 3;         // JSON Web Key Set
    TYPE_RSA = 4;          // RSA 密钥对
    TYPE_ECDSA = 5;        // ECDSA 密钥对
    TYPE_ED25519 = 6;      // Ed25519 密钥对
    TYPE_SSH_KEY = 7;      // SSH 公私钥
    TYPE_X509 = 8;         // 证书
    TYPE_LICENSE = 9;      // 软件 License
  }

  // Name 凭据名称
  string name = 1;
  // 凭据类型
  Type type = 2;
  // Appid 凭据关联的应用 ID
  string appid = 3;
  // Appkey 凭据关联的密钥
  string appkey = 4;
  // 公钥
  string public_key = 5;
  // 私钥
  string private_key = 6;

  string usage = 7;

  // 过期时间
  google.protobuf.Timestamp expires_at = 8;
}

message OAuth2JSONWebKeys {
  message Key {
    string kty = 1;
    string use = 2;
    string alg = 3;
    string e = 4;
    string n = 5;
    string kid = 6;
  }

  repeated Key keys = 1;
}

// AuthToken 登录成功响应
// 参考 rfc 规范：https://www.rfc-editor.org/rfc/rfc6749#section-5
message AuthToken {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
}