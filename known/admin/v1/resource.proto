syntax = "proto3";

// 根据具体的微服务名称做更改
package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

import "google/protobuf/field_mask.proto";

import "known/admin/v1/admin.common.proto";

message ListResourcesRequest {
  // 父资源名称，用于限定范围。
  // 格式示例: "organizations/123" 或 "projects/456"。
  string parent = 1;

  // 每页返回的最大资源数。
  // - structure=STRUCTURE_UNSPECIFIED 或 STRUCTURE_FLAT：默认 20，最大 100。
  // - structure=STRUCTURE_TREE 或 STRUCTURE_TREE_EXPANDED：默认 1000，最大 5000。
  int32 page_size = 2;

  oneof pagination {
    // Cursor-based 分页
    string page_token = 3;

    // Offset-based 分页
    int32 offset = 4;
  }

  View view = 5;
  Structure structure = 6;

  // 过滤条件，采用 AIP-160 定义的标准 filter 语法。
  // 示例: `email="alice@example.com" AND state="ACTIVE"`
  string filter = 7;

  // 排序规则，指定结果返回顺序。
  // 格式: "field_name [asc|desc], ..."。
  // 示例: "create_time desc, name asc"
  // AIP-132: order_by 是可选字段。
  string order_by = 8;

  // TODO；以下将来会统一使用 filter 参数实现过滤
  int32 resource_type = 9;
  int32 resource_status = 10;
  int32 scope_type = 11;
  string scope_name = 12;
  int32 policy_type = 13;
  int32 policy_status = 14;
}

message ListResourcesResponse {
  repeated Resource resources = 1;

  // 用于获取下一页结果的 token。
  // - 如果为空，表示没有更多结果。
  // - 客户端不需要理解其内容，只需原样传回。
  // AIP-132: 必须字段。
  string next_page_token = 2;

  // 符合条件的资源总数。
  // - 常用于前端分页控件。
  // - 注意：可能会因性能原因而近似。
  // AIP-132: total_size 是可选字段。
  int32 total_size = 3;
}

message CreateResourceRequest {
  /*
  {
    "parent_id": "1",
    "code": "user-management",
    "display_name": "用户管理",
    "sort_order": 0,
    "type": "MENU",
    "status": "ENABLED",
    "visibility": "VISIBLE",
    "locator": "/hello/world",
    "visual": "avatar",
    "manifest": "",
    "metadata": {
        "hello": "world"
    },
    "description": "admin"
  }

  注意：code 为可选字段，如客户端未提供，服务端将自动生成 12 位随机编码。
  如提供，需符合 code 规范：以小写字母开头，仅 [a-z0-9-]，长度 2-32，不允许连续 "--"。
  */
  Resource resource = 1;
}

message UpdateResourceRequest {
  Resource resource = 1;

  google.protobuf.FieldMask update_mask = 3;
}

message DeleteResourceRequest {
  int64 id = 1;
}

message CreateResourceScopesRequest {
  int64 resource_id = 1;
  repeated Scope scopes = 2;
}

message CreateResourceScopesResponse {
  repeated Scope scopes = 1;
}

message GetResourceRequest {
  int64 id = 1;
}