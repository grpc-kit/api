syntax = "proto3";

// 根据具体的微服务名称做更改
package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

import "google/protobuf/empty.proto";

import "known/admin/v1/admin.common.proto";
import "known/admin/v1/auth.proto";
import "known/admin/v1/config.proto";
import "known/admin/v1/department.proto";
import "known/admin/v1/security.proto";
import "known/admin/v1/user.proto";
import "known/admin/v1/roles.proto";
import "known/admin/v1/group.proto";
import "known/admin/v1/database.proto";
import "known/admin/v1/policy.proto";
import "known/admin/v1/service.proto";
import "known/admin/v1/menu.proto";

service KnownAdmin {
  // 本地配置
  rpc GetConfig(GetConfigRequest) returns (LocalConfig);
  rpc GetConfigServices(GetConfigServicesRequest) returns (ServicesConfig);
  rpc GetConfigDiscover(GetConfigDiscoverRequest) returns (DiscoverConfig);
  rpc GetConfigSecurity(GetConfigSecurityRequest) returns (SecurityConfig);
  rpc GetConfigDatabase(GetConfigDatabaseRequest) returns (DatabaseConfig);
  rpc GetConfigCachebox(GetConfigCacheboxRequest) returns (CacheboxConfig);
  rpc GetConfigDebugger(GetConfigDebuggerRequest) returns (DebuggerConfig);
  rpc GetConfigObjstore(GetConfigObjstoreRequest) returns (ObjstoreConfig);
  rpc GetConfigFrontend(GetConfigFrontendRequest) returns (FrontendConfig);
  rpc GetConfigObservables(GetConfigObservablesRequest) returns (ObservablesConfig);
  rpc GetConfigCloudEvents(GetConfigCloudEventsRequest) returns (CloudEventsConfig);
  rpc GetConfigAutomations(GetConfigAutomationsRequest) returns (AutomationsConfig);

  // 认证鉴权
  rpc UpsertAuthProviders(UpsertAuthProvidersRequest) returns(UpsertAuthProvidersResponse);
  rpc ListAuthProviders(ListAuthProvidersRequest) returns(ListAuthProvidersResponse);
  rpc CreateAuthProvider(CreateAuthProviderRequest) returns(AuthProvider);
  rpc GetAuthProvider(GetAuthProviderRequest) returns(AuthProvider);
  rpc DeleteAuthProvider(DeleteAuthProviderRequest) returns(google.protobuf.Empty);
  rpc UpdateAuthProvider(UpdateAuthProviderRequest) returns(AuthProvider);

  // 登录认证
  rpc CreateAuthLogin(CreateAuthLoginRequest) returns (AuthToken);
  rpc CreateAuthToken(CreateAuthTokenRequest) returns (AuthToken);
  rpc GetAuthCallback(GetAuthCallbackRequest) returns(GetAuthCallbackResponse);

  // MFA 多因素认证
  rpc VerifyAuthMFA(VerifyAuthMFARequest) returns (AuthToken);
  rpc StartAuthMFASetup(StartAuthMFASetupRequest) returns (StartAuthMFASetupResponse);
  rpc ConfirmAuthMFASetup(ConfirmAuthMFASetupRequest) returns (AuthToken);
  rpc SetupUserMFA(SetupUserMFARequest) returns (SetupUserMFAResponse);
  rpc ConfirmUserMFA(ConfirmUserMFARequest) returns (ConfirmUserMFAResponse);
  rpc DisableUserMFA(DisableUserMFARequest) returns (google.protobuf.Empty);

  // 服务字典管理
  rpc ListServices(ListServicesRequest) returns(ListServicesResponse);
  rpc ListServiceActions(ListServiceActionsRequest) returns(ListServiceActionsResponse);

  // 菜单管理
  rpc ListMenus(ListMenusRequest) returns(ListMenusResponse);
  rpc CreateMenu(CreateMenuRequest) returns(Menu);
  rpc UpdateMenu(UpdateMenuRequest) returns(Menu);
  rpc DeleteMenu(DeleteMenuRequest) returns(google.protobuf.Empty);

  // 策略管理
  rpc ListPolicies(ListPoliciesRequest) returns(ListPoliciesResponse);
  rpc CreatePolicy(CreatePolicyRequest) returns(Policy);
  rpc UpdatePolicy(UpdatePolicyRequest) returns(Policy);
  rpc DeletePolicy(DeletePolicyRequest) returns(google.protobuf.Empty);

  // 角色相关
  rpc CreateRole(CreateRoleRequest) returns(Role);
  rpc GetRole(GetRoleRequest) returns(Role);
  rpc UpdateRole(UpdateRoleRequest) returns(Role);
  rpc DeleteRole(DeleteRoleRequest) returns(google.protobuf.Empty);
  rpc ListRoles(ListRolesRequest) returns(ListRolesResponse);
  rpc ListRoleMembers(ListRoleMembersRequest) returns(ListRoleMembersResponse);
  rpc CreateRoleMembers(CreateRoleMembersRequest) returns(CreateRoleMembersResponse);
  rpc UpdateRoleMembers(UpdateRoleMembersRequest) returns(UpdateRoleMembersResponse);
  rpc DeleteRoleMember(DeleteRoleMemberRequest) returns(google.protobuf.Empty);
  //rpc CreateRoleDataRanges(CreateRoleDataRangesRequest) returns(CreateRoleDataRangesResponse);
  //rpc DeleteRoleDataRanges(DeleteRoleDataRangesRequest) returns(google.protobuf.Empty);
  //rpc ListRoleDataRanges(ListRoleDataRangesRequest) returns(ListRoleDataRangesResponse);

  // 部门管理
  rpc CreateDepartment(CreateDepartmentRequest) returns(Department);
  rpc ListDepartments(ListDepartmentsRequest) returns(ListDepartmentsResponse);
  rpc DeleteDepartment(DeleteDepartmentRequest) returns(google.protobuf.Empty);
  rpc UpdateDepartment(UpdateDepartmentRequest) returns(Department);
  rpc ListDepartmentMembers(ListDepartmentMembersRequest) returns(ListDepartmentMembersResponse);
  rpc CreateDepartmentMembers(CreateDepartmentMembersRequest) returns(CreateDepartmentMembersResponse);
  rpc UpdateDepartmentMembers(UpdateDepartmentMembersRequest) returns(UpdateDepartmentMembersResponse);
  rpc DeleteDepartmentMember(DeleteDepartmentMemberRequest) returns(google.protobuf.Empty);

  // 用户相关
  rpc GetUser(GetUserRequest) returns(User);
  rpc CreateUser(CreateUserRequest) returns(User);
  rpc UpdateUser(UpdateUserRequest) returns(User);
  rpc ListUsers(ListUsersRequest) returns(ListUsersResponse);
  rpc UpdateUserPassword(UpdateUserPasswordRequest) returns(UpdateUserPasswordResponse);

  // rpc CreateUserIdentity(CreateUserIdentityRequest) returns(User);
  // 群组相关
  rpc CreateGroup(CreateGroupRequest) returns(Group);
  rpc ListGroups(ListGroupsRequest) returns(ListGroupsResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns(Group);
  rpc DeleteGroup(DeleteGroupRequest) returns(google.protobuf.Empty);
  rpc ListGroupMembers(ListGroupMembersRequest) returns(ListGroupMembersResponse);
  rpc CreateGroupMembers(CreateGroupMembersRequest) returns(CreateGroupMembersResponse);
  rpc DeleteGroupMember(DeleteGroupMemberRequest) returns(google.protobuf.Empty);
  rpc UpdateGroupMember(UpdateGroupMemberRequest) returns(Membership);
  rpc GetGroup(GetGroupRequest) returns(Group);

  // 安全相关
  rpc CreateCredential(CreateCredentialRequest) returns(Credential);
  rpc GetOAuth2Discovery(google.protobuf.Empty) returns(OAuth2Discovery);
  rpc GetOAuth2JSONWebKeys(google.protobuf.Empty) returns(OAuth2JSONWebKeys);
  rpc GetOAuth2Userinfo(google.protobuf.Empty) returns(OAuth2Userinfo);

  // 数据库相关
  rpc CreateDatabaseInitialize(CreateDatabaseInitializeRequest) returns(google.protobuf.Empty);
}