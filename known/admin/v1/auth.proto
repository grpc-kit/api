syntax = "proto3";

// 根据具体的微服务名称做更改
package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

// CreateAuthLoginRequest 用于登录请求
message CreateAuthLoginRequest {
  // Username 系统识别的用户名全局唯一
  string username = 1;
  // Email 用户邮箱地址
  string email = 2;
  // PhoneNumber 用户手机号
  string phone_number = 3;
  // ExpiresIn 控制生成 access_token 的有效时长，默认 24 * 60 * 60 秒
  int32 expires_in = 7;
  // PasswordHash 用户密码在本地使用 sha256 哈希结果
  string password_hash = 9;
}

// CreateAuthLoginResponse 登录成功响应
// 参考 rfc 规范：https://www.rfc-editor.org/rfc/rfc6749#section-5
message CreateAuthLoginResponse {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
}

message ListAuthProvidersRequest {

}

message AuthProvider {
  enum ProviderType {
    LOCAL = 0;
    LDAP = 1;
    OIDC = 2;
    OAUTH2 = 3;
    GITHUB = 4;
    GOOGLE = 5;
    WECHAT = 6;
  }

  string name = 1;
  ProviderType type = 2;
  string client_id = 3;
  string client_secret = 4;
  bool enabled = 5;
  string redirect_uri = 6;
  string scopes = 7;
  string issuer = 8;
  string authorization_endpoint = 9;
  string token_endpoint = 10;
  string userinfo_endpoint = 11;
}

message ListAuthProvidersResponse {
  repeated AuthProvider providers = 1;
}

message UpsertAuthProvidersRequest {
  repeated AuthProvider providers = 1;
}

message UpsertAuthProvidersResponse {
  repeated AuthProvider providers = 1;
}

message GetAuthCallbackRequest {
  string provider_name = 1;
  string code = 2;
  string state = 3;
}

message GetAuthCallbackResponse {
  string access_token = 1;
  string token_type = 2;
}
