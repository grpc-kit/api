syntax = "proto3";

package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

import "google/protobuf/field_mask.proto";
import "known/admin/v1/admin.common.proto";

message ListPolicyAttachmentsRequest {
  string parent = 1;
  int32 page_size = 2;

  oneof pagination {
    string page_token = 3;
    int32 offset = 4;
  }

  View view = 5;
  Structure structure = 6;
  string filter = 7;
  string order_by = 8;

  int64 policy_id = 9;
  PolicyAttachment.PrincipalType principal_type = 10;
  int64 principal_id = 11;
}

message ListPolicyAttachmentsResponse {
  repeated PolicyAttachment attachments = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message CreatePolicyAttachmentRequest {
  PolicyAttachment attachment = 1;
}

message UpdatePolicyAttachmentRequest {
  PolicyAttachment attachment = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeletePolicyAttachmentRequest {
  int64 id = 1;
}

message GetPolicyAttachmentRequest {
  int64 id = 1;
}
