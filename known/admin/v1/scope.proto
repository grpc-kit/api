syntax = "proto3";

// 根据具体的微服务名称做更改
package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

import "google/protobuf/field_mask.proto";

import "known/admin/v1/admin.common.proto";

message ListScopesRequest {
  // 父资源名称，用于限定范围。
  // 格式示例: "organizations/123" 或 "projects/456"。
  string parent = 1;

  // 每页返回的最大用户数。
  // - 如果未指定，则使用服务端默认值 (如 20)。
  // - 最大不超过 100 (超出时强制截断)。
  int32 page_size = 2;

  oneof pagination {
    // Cursor-based 分页
    string page_token = 3;

    // Offset-based 分页
    int32 offset = 4;
  }

  View view = 5;
  Structure structure = 6;

  // 过滤条件，采用 AIP-160 定义的标准 filter 语法。
  // 示例: `email="alice@example.com" AND state="ACTIVE"`
  string filter = 7;

  // 排序规则，指定结果返回顺序。
  // 格式: "field_name [asc|desc], ..."。
  // 示例: "create_time desc, name asc"
  // AIP-132: order_by 是可选字段。
  string order_by = 8;

  // TODO；以下将来会统一使用 filter 参数实现过滤
  int32 scope_type = 11;
  string scope_name = 12;
}

message ListScopesResponse {
  repeated Scope scopes = 1;

  // 用于获取下一页结果的 token。
  // - 如果为空，表示没有更多结果。
  // - 客户端不需要理解其内容，只需原样传回。
  // AIP-132: 必须字段。
  string next_page_token = 2;

  // 符合条件的资源总数。
  // - 常用于前端分页控件。
  // - 注意：可能会因性能原因而近似。
  // AIP-132: total_size 是可选字段。
  int32 total_size = 3;
}

message CreateScopeRequest {
  /*
  */
  Scope scope = 1;
}

message UpdateScopeRequest {
  Scope scope = 1;

  google.protobuf.FieldMask update_mask = 3;
}

message DeleteScopeRequest {
  int64 id = 1;
}

message ListScopeResourcesRequest {
  int64 scope_id = 1;

  // 每页返回的最大用户数。
  // - 如果未指定，则使用服务端默认值 (如 20)。
  // - 最大不超过 100 (超出时强制截断)。
  int32 page_size = 2;

  oneof pagination {
    // Cursor-based 分页
    string page_token = 3;

    // Offset-based 分页
    int32 offset = 4;
  }

  View view = 5;
  Structure structure = 6;

  // 过滤条件，采用 AIP-160 定义的标准 filter 语法。
  // 示例: `email="alice@example.com" AND state="ACTIVE"`
  string filter = 7;

  // 排序规则，指定结果返回顺序。
  // 格式: "field_name [asc|desc], ..."。
  // 示例: "create_time desc, name asc"
  // AIP-132: order_by 是可选字段。
  string order_by = 8;
}

// ScopeResourceItem 作用域下的资源项，包含 resource_scope_id 供权限绑定使用
message ScopeResourceItem {
  int64 resource_scope_id = 1;
  Resource resource = 2;
}

message ListScopeResourcesResponse {
  repeated Resource resources = 1;

  // 用于获取下一页结果的 token。
  // - 如果为空，表示没有更多结果。
  // - 客户端不需要理解其内容，只需原样传回。
  // AIP-132: 必须字段。
  string next_page_token = 2;

  // 符合条件的资源总数。
  // - 常用于前端分页控件。
  // - 注意：可能会因性能原因而近似。
  // AIP-132: total_size 是可选字段。
  int32 total_size = 3;

  // 作用域下的资源项（含 resource_scope_id），用于权限绑定等场景
  repeated ScopeResourceItem scope_resource_items = 4;
}

message DeleteScopeResourceRequest {
  int64 scope_id = 1;
  int64 resource_id = 2;
}

message CreateScopeResourcesRequest {
  int64 scope_id = 1;
  repeated Resource resources = 2;
}

message CreateScopeResourcesResponse {
  repeated Resource resources = 1;
}