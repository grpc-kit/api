syntax = "proto3";

package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

import "google/protobuf/field_mask.proto";
import "known/admin/v1/admin.common.proto";

message ListServicesRequest {
	string parent = 1;
	int32 page_size = 2;

	oneof pagination {
		string page_token = 3;
		int32 offset = 4;
	}

	View view = 5;
	Structure structure = 6;
	string filter = 7;
	string order_by = 8;
}

message ListServicesResponse {
	repeated Service services = 1;
	string next_page_token = 2;
	int32 total_size = 3;
}

message CreateServiceRequest {
	Service service = 1;
}

message UpdateServiceRequest {
	Service service = 1;
	google.protobuf.FieldMask update_mask = 2;
}

message DeleteServiceRequest {
	int64 id = 1;
}