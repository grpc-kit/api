syntax = "proto3";

// 根据具体的微服务名称做更改
package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

import "known/admin/v1/admin.common.proto";

message ListUsersRequest {
  // 控制资源返回的详细程度。
  enum UserView {
    USER_VIEW_UNSPECIFIED = 0;
    USER_VIEW_BASIC = 1;
    USER_VIEW_FULL = 2;
  }

  // 父资源名称，用于限定范围。
  // 格式示例: "organizations/123" 或 "projects/456"。
  string parent = 1;

  // 每页返回的最大用户数。
  // - 如果未指定，则使用服务端默认值 (如 20)。
  // - 最大不超过 100 (超出时强制截断)。
  int32 page_size = 2;

  // 上一页返回的 page_token。
  // 客户端无需理解其内容，只需原样传回。
  // string page_token = 3;

  oneof pagination {
    // Cursor-based 分页
    string page_token = 3;

    // Offset-based 分页
    int32 offset = 8;
  }

  // 过滤条件。当前最小实现支持 `deleted_at != null`，用于在
  // show_deleted=true 时请求仅包含软删除用户的回收站列表。
  // 其他字段过滤继续使用下方兼容字段，后续再统一扩展 AIP-160 语法。
  string filter = 4;

  // 排序规则，指定结果返回顺序。
  // 格式: "field_name [asc|desc], ..."。
  // 示例: "create_time desc, name asc"
  // AIP-132: order_by 是可选字段。
  string order_by = 5;

  // 是否包含已删除资源。
  // - 默认 false，仅返回有效资源。
  // - 设为 true 可返回软删除的用户。
  // AIP-132: show_deleted 是可选字段。
  bool show_deleted = 6;

  // 视图模式，决定返回数据的详细程度。
  // - BASIC: 基本信息（默认）
  // - FULL: 详细信息
  // AIP-157: 建议支持。
  UserView view = 7;

  // TODO；将来会统一使用 filter 参数实现过滤
  string filter_id = 11;
  string filter_username = 12;
  string filter_nickname = 13;
  string filter_status = 14;
}

message ListUsersResponse {
  // 符合查询条件的用户资源。
  repeated User users = 1;

  // 用于获取下一页结果的 token。
  // - 如果为空，表示没有更多结果。
  // - 客户端不需要理解其内容，只需原样传回。
  // AIP-132: 必须字段。
  string next_page_token = 2;

  // 符合条件的资源总数。
  // - 常用于前端分页控件。
  // - 注意：可能会因性能原因而近似。
  // AIP-132: total_size 是可选字段。
  int32 total_size = 3;
}

message CreateUserRequest {
  User user = 1;
}

message UpdateUserRequest {
  User user = 1;

  google.protobuf.FieldMask update_mask = 3;
}

message GetUserRequest {
  // ID 用户 ID，全局唯一标识
  int64 id = 1;
  // 用户名，系统登录凭证，通常唯一
  string username = 2;
}

// ListUserAuthBindingsRequest selects the managed user whose authentication
// identities should be returned. Authorization is enforced by the method's
// IAM policy before the handler runs.
message ListUserAuthBindingsRequest {
  int64 user_id = 1;
}

message ListUserAuthBindingsResponse {
  repeated UserAuthBinding bindings = 1;
}

// UserAuthBinding is a read-only administrator projection. It deliberately
// excludes password hashes, MFA secrets, external tokens and provider secrets.
message UserAuthBinding {
  int64 id = 1;
  int64 user_id = 2;

  int64 provider_id = 3;
  string provider_code = 4;
  string provider_display_name = 5;
  AuthProvider.Type provider_type = 6;
  AuthProvider.Status provider_status = 7;
  string provider_icon_url = 8;

  string provider_user_id = 9;
  string provider_union_id = 10;

  // Whether the user-level credential required by this provider is configured.
  // Currently this is populated for LOCAL identities only and is absent for
  // providers that do not have a user-level credential in this model.
  optional bool credential_configured = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// DeleteUser moves a user into the recycle bin. The resource remains
// recoverable through UndeleteUser until it is explicitly expunged.
message DeleteUserRequest {
  int64 id = 1;
}

// UndeleteUser restores a soft-deleted user in DISABLED state.
message UndeleteUserRequest {
  int64 id = 1;
}

// ExpungeUser permanently removes a soft-deleted user and its core
// dependent data. This operation cannot target an active user.
message ExpungeUserRequest {
  int64 id = 1;
}

// DeleteUserMFARequest removes the MFA enrollment for a managed user.
// Authorization is enforced by the configured policy layer.
message DeleteUserMFARequest {
  int64 user_id = 1;
}

// GetCurrentUserRequest intentionally has no target-user fields. The
// authenticated subject in the request context is the only lookup key.
message GetCurrentUserRequest {}

// CurrentUserProfile is the self-service projection used by the personal
// center. It deliberately excludes administrator-only audit, identity and
// membership fields from User.
message CurrentUserProfile {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string profile = 4;
  string picture = 5;
  string website = 6;
  string timezone = 7;
  string locale = 8;
  User.Type type = 9;
  User.Status status = 10;
  User.Gender gender = 11;
  google.protobuf.Timestamp birthday = 12;
  string email = 13;
  bool email_verified = 14;
  PhoneNumber phone_number = 15;
  bool phone_number_verified = 16;
  bool mfa_enabled = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  string etag = 20;
  // Whether this account has an active local-password identity that can be
  // changed from the personal center.
  bool password_change_supported = 21;
}

// CurrentUserProfileUpdate contains the editable portion of the current
// subject's profile. Fields are applied only when named by update_mask.
message CurrentUserProfileUpdate {
  string nickname = 1;
  string profile = 2;
  string picture = 3;
  string website = 4;
  string timezone = 5;
  string locale = 6;
  User.Gender gender = 7;
  google.protobuf.Timestamp birthday = 8;
}

message UpdateCurrentUserRequest {
  CurrentUserProfileUpdate profile = 1;
  google.protobuf.FieldMask update_mask = 2;
  // The etag returned by GetCurrentUser. A stale value is rejected with 409.
  string etag = 3;
}

message ChangeCurrentUserPasswordRequest {
  // The browser-side SHA-256 value of the current password. This preserves
  // the existing login protocol; it is never stored directly.
  string current_password_hash = 1;
  // The browser-side SHA-256 value of the replacement password.
  string new_password_hash = 2;
}

