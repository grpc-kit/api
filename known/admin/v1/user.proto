  // ID 用户 ID，全局唯一标识
//  int32 id = 1;
  // 用户名，系统登录凭证，通常唯一
//  string username = 2;
  // PasswordHash 用户密码在本地使用 sha256 哈希结果
//  string password_hash = 3;
//}

message UpdateUserPasswordRequest {
  // ID 用户 ID，全局唯一标识
  int64 user_id = 1;
  // 用户名，系统登录凭证，通常唯一
  string username = 2;
  // PasswordHash 用户密码在本地使用 sha256 哈希结果
  string new_password_hash = 3;
  string old_password_hash = 4;
}

message UpdateUserPasswordResponse {

}
