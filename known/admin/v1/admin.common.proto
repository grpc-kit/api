syntax = "proto3";

// 根据具体的微服务名称做更改
package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

// 引入 google 公共类型
import "google/protobuf/timestamp.proto";

// enum 参考以下规范 https://google.aip.dev/126
// 包级枚举取值应带枚举名前缀

// 通用：用于所有 List / Get / BatchGet
enum View {
  VIEW_UNSPECIFIED = 0;
  // List 默认
  VIEW_BASIC = 1;
  // 常规详情
  VIEW_STANDARD = 2;
  // 全量
  VIEW_FULL = 3;
}

// 通用：用于任何支持层级 / 关系返回的 List API
enum Structure {
  STRUCTURE_UNSPECIFIED = 0;
  // 平铺列表（默认），支持分页
  STRUCTURE_FLAT = 1;
  // 层级结构（父子），不支持分页
  STRUCTURE_TREE = 2;
  // 层级结构 + 全展开，不支持分页
  STRUCTURE_TREE_EXPANDED = 3;
}

// 可见性是“前置过滤”，权限是“后置校验”
// 通用：部门/资源/凭证的可见性策略
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;

  // 全开：跨部门、跨层级全局可见
  // 资源/部门：系统中所有合法用户均可检索/看到
  VISIBILITY_GLOBAL = 1;

  // 组织架构树可见：本部门及下属部门可见（向下递归）
  // 部门：成员处于相同节点或上级节点可见其下属节点（不管下级节点设置的可见性）
  // 资源：同部门及子部门成员可见
  VISIBILITY_SUBTREE = 2;

  // 仅本级可见：仅限本部门成员，不包含子部门
  // 部门：仅同级成员可见，不向下扩散
  // 资源：仅本节点成员可见
  VISIBILITY_LOCAL = 3;

  // 私有：仅创建者/负责人及系统内部可见（最严限制）
  // 部门：同级成员也不可见，仅管理员或特定负责人可见
  // 资源：仅创建者或指定授权人可见
  VISIBILITY_RESTRICTED = 4;

  // 特定受众：基于白名单（如特定团队、特定角色）
  // 如果逻辑复杂，通常此项作为占位，具体配置存入关联表
  VISIBILITY_SPECIFIC = 5;
}

// Address 用户地址
// https://openid.net/specs/openid-connect-core-1_0.html#AddressClaim
message Address {
  string country = 1;
  string postal_code = 2;
  string region = 3;
  string locality = 4;
  string street_address = 5;
}

// PhoneNumber 手机号，以 E.164 格式存储（E.164 = '+' + 国家码 + 本地号码）总长度 ≤ 15 位，如：+8613812345678
message PhoneNumber {
  // 国家码，字符串更通用，例如 "86", "1"
  string country_code = 1;
  // 本地号码，字符串存储，避免丢失前导零
  string national_number = 2;
}

// Department 组织部门实体，支持树形层级结构的企业组织架构管理
// 设计原则：一个用户仅可归属于一个主部门，但可通过角色关系参与多个部门的管理
// 支持国际化、状态管理、财务集成等企业级功能
message Department {
  // ID 部门唯一标识符，系统自动生成
  // 用于数据库主键和跨系统引用，建议使用自增整型
  int64 id = 1;
  
  // ParentID 父部门ID，构建树形组织结构
  // 值为 0 表示顶级部门（如：总公司、集团总部）
  // 支持多级嵌套，建议层级深度不超过 6 级以保证查询性能
  int64 parent_id = 2;
  
  // Code 系统标识符，创建后不可修改
  // 规则：以小写字母开头，仅包含小写字母、数字和连字符，不允许连续连字符，以字母或数字结尾
  // 长度：2-32 字符；如客户端未提供，服务端自动生成 12 位随机编码
  // 示例：手动 "tech-dept"、"hr"；自动 "a7k2m3x9b5f1"
  string code = 3;
  
  // DisplayName 前端展示名称，根据用户的语言环境，自动转换为相应区域的语言说明
  // 用于部门名称的多语言显示，提升用户体验和国际化支持
  string display_name = 4;
  
  // Type 部门类型分类，用于业务逻辑和权限控制
  enum Type {
    TYPE_UNSPECIFIED = 0;  // 未指定类型
    BUSINESS = 1;     // 业务部门 - 直接产生收入的核心业务单位
    SUPPORT = 2;      // 支持部门 - 为业务部门提供服务支撑（如：IT、HR）
    MANAGEMENT = 3;   // 管理部门 - 负责决策和监督的管理层级
    VIRTUAL = 4;      // 虚拟部门 - 项目组、临时团队等非固定组织
  }
  Type type = 5;

  // Status 部门运营状态，用于生命周期管理
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 未指定状态（系统默认值）
    ACTIVE = 1;       // 正常运营 - 部门正常工作，可分配员工和任务
    INACTIVE = 2;     // 暂停运营 - 临时停止业务，员工可能被临时调配
    DISSOLVED = 3;    // 已解散 - 部门正式撤销，员工需重新分配
    MERGING = 4;      // 合并中 - 正在与其他部门合并，处于过渡状态
  }
  Status status = 6;

  // SortOrder 部门排序顺序，用于同级部门的显示顺序
  // 数值越小排序越靠前，建议使用 10 的倍数便于后续插入
  // 默认值：100，范围：1-9999
  int32 sort_order = 7;
  
  // Members 部门成员列表
  repeated Membership members = 8;

  // Children 直接子部门列表，用于构建完整的组织树
  // 仅包含直接下级，避免深度递归查询
  // 建议在需要完整树结构时通过专门的服务接口获取
  repeated Department children = 9;

  // Email 部门公共邮箱地址，用于对外联系和内部通知
  // 格式：标准邮箱格式，如 "tech@company.com"
  // 用途：部门公告、外部合作、客户联系等
  string email = 10;

  // PhoneNumber 部门联系电话，支持国际化电话号码格式
  // 包含国家代码、区号、号码等完整信息
  // 用于紧急联系、业务咨询等场景
  PhoneNumber phone_number = 11;

  // Address 部门办公地址，支持结构化地址信息
  // 包含国家、省市、详细地址等信息
  // 用于邮寄、拜访、资产管理等业务场景
  Address address = 12;

  // CostCenterCode 成本中心编码，用于财务核算和成本控制
  // 格式：企业自定义编码规则，如 "CC-TECH-001"
  // 用途：预算分配、成本归集、财务报表等
  // 与 ERP 系统集成时的重要标识字段
  string cost_center_code = 13;
  
  // BudgetCode 预算编码，用于预算管理和费用控制
  // 格式：与财务系统对应的预算科目编码
  // 用途：年度预算、费用审批、财务分析等
  // 支持多维度预算管理（如：人员预算、设备预算等）
  string budget_item_code = 14;

  // MaxMembers 部门最大成员数限制，用于人员规模控制
  // 值为 0 表示无限制，正整数表示具体限制
  // 用途：组织规模控制、人力成本管理、办公空间规划
  int32 max_members = 15;
  
  // ExternalID 外部系统标识符，用于第三方系统集成
  // 如：ERP 系统部门编码、OA 系统部门 ID 等
  // 支持数据同步和跨系统业务流程
  string external_id = 16;
  
  // Metadata 扩展元数据，存储自定义业务属性
  // 键值对格式，支持灵活的业务扩展需求
  // 示例：{"location": "北京", "floor": "15F", "capacity": "50"}
  map<string, string> metadata = 17;

  // CreatedBy 创建者用户ID，记录部门创建人
  // 用于审计追踪和权限验证
  int64 created_by = 18;
  
  // UpdatedBy 最后更新者用户ID，记录最近修改人
  // 用于变更追踪和责任确认
  int64 updated_by = 19;
  
  // CreatedAt 创建时间戳，记录部门建立时间
  // 使用 UTC 时间，精确到毫秒级别
  google.protobuf.Timestamp created_at = 20;
  
  // UpdatedAt 最后更新时间戳，记录最近修改时间
  // 用于数据同步和缓存失效判断
  google.protobuf.Timestamp updated_at = 21;
  
  // DeletedAt 软删除时间戳，支持数据恢复
  // 非空表示已删除，空值表示正常状态
  // 实现软删除机制，保护重要组织数据
  google.protobuf.Timestamp deleted_at = 22;

  // Description 部门描述信息，详细说明部门职责和业务范围
  // 用于组织介绍、职责说明、业务范围描述等
  // 建议长度：500 字符以内，支持富文本格式
  string description = 23;

  // Visibility 部门及成员列表的可见性策略（使用公共枚举 Visibility）
  Visibility visibility = 24;
}

// Scope 作用域
message Scope {
  // ID 资源 ID
  int64 id = 1;

  // Type 作用域类型
  enum Type {
    TYPE_UNSPECIFIED = 0;
    /*
      admin   后台管理端
      user    前台用户端
      app     移动端
     */
    PLATFORM = 1; // admin, user, app

    /*
      readonly
      readwrite
     */
    ACTION = 2;
  }
  Type type = 2;

  // Code 系统标识符，创建后不可修改
  // 规则：以小写字母开头，仅包含小写字母、数字和连字符，不允许连续连字符，以字母或数字结尾
  // 长度：2-32 字符；如客户端未提供，服务端自动生成 12 位随机编码
  // 示例：手动 "admin"、"readonly"；自动 "a7k2m3x9b5f1"
  // 默认存在以下内部作用域：admin（后台用户菜单查看权限）、user（前端用户菜单查看权限）
  string code = 3;
  string display_name = 4;

  string description = 5;
}

// Resource 资源定义，如：菜单等
message Resource {
  // ID 资源 ID
  int64 id = 1;
  // ParentID 父资源 ID，为 0 表示顶级资源
  int64 parent_id = 2;
  // Code 系统标识符，创建后不可修改
  // 规则：以小写字母开头，仅包含小写字母、数字和连字符，不允许连续连字符，以字母或数字结尾
  // 长度：2-32 字符；如客户端未提供，服务端自动生成 12 位随机编码
  // 示例：手动 "user-management"、"system-config"；自动 "a7k2m3x9b5f1"
  string code = 3;
  // DisplayName 前端展示名称，根据用户的语言环境，自动转换为相应区域的语言说明
  // 用于资源名称的多语言显示，支持菜单、按钮等界面元素的国际化
  string display_name = 4;
  // SortOrder 资源排序顺序，用于同级资源的显示顺序
  // 数值越小排序越靠前，建议使用 10 的倍数便于后续插入
  // 默认值：100，范围：1-9999
  int32 sort_order = 5;

  // Type 资源类型
  enum Type {
    TYPE_UNSPECIFIED = 0;
    MENU    = 1; // 菜单（页面入口，会在菜单栏中显示）
    PAGE    = 2; // 页面（路由级，不会在菜单栏中显示）
    BUTTON  = 3; // 按钮 / UI 操作
    API     = 4; // 后端接口（包含 grpc、http 等）
    DATA    = 5; // 数据级资源（行 / 字段）
    SYSTEM  = 6; // 系统级 / 非 UI 资源（如：系统设置、系统日志等）
  }
  Type type = 6;
  
  // Status 资源状态
  enum Status {
    STATUS_UNSPECIFIED = 0;

    ENABLED = 1; // 启用
    DISABLED = 2; // 禁用
  }
  Status status = 7;

  // Enabled 资源是否启用
  // bool enabled = 8;
  // Hidden 是否在资源列表中隐藏
  // bool hidden = 9;
  // HideChildren 是否在资源列表中隐藏子项
  // bool hide_children = 10;

  // Visibility 资源可见性/展示策略（使用公共枚举 Visibility）
  Visibility visibility = 8;

  // Locator 资源路径，我怎么找到你
  string locator = 11;
  // visual 资源图标，我怎么看到你
  string visual = 12;
  // Manifest 资源描述，我怎么用你
  string manifest = 13;
  // Metadata 扩展元数据
  // 用于存储上述三个核心字段无法涵盖的特定平台/业务属性
  map<string, string> metadata = 14;

  // Children 子资源列表
  repeated Resource children = 15;

  repeated Scope scopes = 16;

  string description = 17;

  // CreatedBy 创建者用户ID，记录部门创建人
  // 用于审计追踪和权限验证
  int64 created_by = 18;
  
  // UpdatedBy 最后更新者用户ID，记录最近修改人
  // 用于变更追踪和责任确认
  int64 updated_by = 19;

  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

// Policy 策略定义
message Policy {
  // ID 资源 ID
  int64 id = 1;

  // Type 策略类型
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ROLE = 1;
    OPEN_POLICY_AGENT = 2;
  }
  Type type = 2;

  // Status 策略状态，用于生命周期管理
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 未指定状态（系统默认值）

    // ===== 正常生命周期 =====
    DRAFT = 1;        // 草稿：未生效，仅用于编辑/评审
    ENABLED = 2;      // 已启用：正在参与授权决策
    DISABLED = 3;     // 已禁用：保留配置，但不参与决策

    // ===== 变更 / 风险控制 =====
    PENDING = 4;     // 待生效：已配置，等待审批或时间触发
    SUSPENDED = 5;   // 已挂起：紧急风控临时冻结（可自动/人工）

    // ===== 生命周期结束 =====
    DEPRECATED = 6;  // 已废弃：不推荐使用，允许已有绑定
    ARCHIVED = 7;    // 已归档：只读，仅审计/历史查询
  }
  Status status = 3;

  // Code 系统标识符，创建后不可修改
  // 规则：以小写字母开头，仅包含小写字母、数字和连字符，不允许连续连字符，以字母或数字结尾
  // 长度：2-32 字符；如客户端未提供，服务端自动生成 12 位随机编码
  // 示例：手动 "allow-read"、"deny-delete"；自动 "a7k2m3x9b5f1"
  string code = 4;

  // DisplayName 前端展示名称，根据用户的语言环境，自动转换为相应区域的语言说明
  string display_name = 5;

  // Value 策略值，根据策略类型不同，表示不同的含义
  string value = 6;

  // Description 策略描述，详细说明策略职责和业务范围
  string description = 7;
}

message Permission {
  // ID 资源 ID
  int64 id = 1;
  // Code 系统标识符，创建后不可修改
  // 规则：以小写字母开头，仅包含小写字母、数字和连字符，不允许连续连字符，以字母或数字结尾
  // 长度：2-32 字符；如客户端未提供，服务端自动生成 12 位随机编码
  string code = 2;
  string display_name = 3;

  Policy policy = 4;

  // 废弃，使用 Binding 替代
  // repeated Resource resources = 5;

  string description = 6;

  message Binding {
    int64 id = 1;

    // 资源范围
    int64 resource_scope_id = 2;
    // 是否递归子资源
    bool is_recursive = 3;

    Resource resource = 5;
  }

  // 权限绑定资源集合
  repeated Binding bindings = 7;
}

// User 用户实体，表示系统中的账号信息
message User {
  // 以下字段为非敏感/可直接输出（适合公开展示或普通资料页）

  // ID 用户 ID，全局唯一标识，使用 int64 序列化为 json 为 string 类型
  int64 id = 1;
  // 用户名，系统登录凭证，必须唯一
  string username = 2;
  // 昵称，用于社交或前端展示
  string nickname = 3;
  // 个人简介或签名
  string profile = 4;
  // 用户头像 URL
  string picture = 5;
  // 个人网站地址
  string website = 6;
  // 时区信息（IANA 时区标识，例如 "Asia/Shanghai"）
  string timezone = 7;
  // 用户偏好的语言与地区（例如 "zh-CN"、"en-US"）
  string locale = 8;

  // 以下字段受限输出（仅本人或具备权限的管理员可见，外部或公共接口谨慎返回）

  // 用户的基础身份类型，后端自动维护更新，非人为更新
  enum Type {
    TYPE_UNSPECIFIED = 0;  // 默认值

    // 外部用户 / 业务伙伴
    CUSTOMER = 1;     // 前台用户 / 消费者
    MERCHANT = 2;     // 商户 / 卖家
    SUPPLIER = 3;     // 供应商 / 合作方

    // 内部用户 / 员工
    EMPLOYEE = 10;    // 后台用户 / 内部员工
    ADMIN = 11;       // 系统管理员

    // 系统账户 (为安全和区分，编号拉开)
    SYSTEM = 99;      // 系统集成账户 / 机器人
  }
  Type type = 9;

  // 用户状态（枚举值预计不会太频繁变化）
  // 可以根据业务再增加状态
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 默认值／未知状态
    PENDING = 1;      // 待激活／待验证
    ACTIVE = 2;       // 正常启用状态
    LOCKED = 3;       // 被锁定（如连续密码错误、账号风控等）
    DISABLED = 4;     // 禁用（人工停用）
    EXPIRED = 5;      // 过期等（订阅过期、账号注销等）
    SUSPENDED = 6;   // 暂时冻结（如风控触发、投诉处理中）
    DELETED = 7;     // 已注销（区别软删除）
  }
  Status status = 10;

  // Gender 用户性别
  enum Gender {
    GENDER_UNSPECIFIED = 0;
    MALE = 1;        // 男性
    FEMALE = 2;      // 女性
    OTHER = 3;       // 其他
    PRIVATE = 4;     // 保密，不愿透露
  }
  Gender gender = 11;

  // 邮箱是否已验证
  bool email_verified = 12;
  // 手机号码是否已验证
  bool phone_number_verified = 13;

  // 创建时间
  google.protobuf.Timestamp created_at = 15;
  // 更新时间
  google.protobuf.Timestamp updated_at = 16;
  // 删除时间
  google.protobuf.Timestamp deleted_at = 17;

  // 敏感字段（默认不直接对外输出，需权限并建议脱敏）

  // 真实姓名，用于实名认证或后台展示
  string realname = 19;
  // 身份证号，用于身份验证（可选）
  string national_id = 20;
  // 邮箱地址
  string email = 21;
  // 出生日期
  google.protobuf.Timestamp birthday = 22;
  // 手机号码
  PhoneNumber phone_number = 23;
  // 地址信息
  Address address = 24;

    // CreatedBy 创建者用户ID，记录部门创建人
  // 用于审计追踪和权限验证
  int64 created_by = 25;
  
  // UpdatedBy 最后更新者用户ID，记录最近修改人
  // 用于变更追踪和责任确认
  int64 updated_by = 26;

  // 自定义元数据，用于存储额外的用户信息（如 JSON 字符串）
  map<string, string> metadata = 27;
}

// Role 角色实体，表示用户在系统上的权限和功能
message Role {
  // ID 角色 ID，全局唯一标识
  int64 id = 1;
  // ParentID 父角色ID，构建树形组织结构
  // 值为 0 表示顶级角色（如：系统内置角色）
  // 支持多级嵌套，建议层级深度不超过 3 级以保证查询性能
  int64 parent_id = 2;

  // Code 系统标识符，创建后不可修改
  // 规则：以小写字母开头，仅包含小写字母、数字和连字符，不允许连续连字符，以字母或数字结尾
  // 长度：2-32 字符；如客户端未提供，服务端自动生成 12 位随机编码
  // 示例：手动 "admin"、"user-manager"；自动 "a7k2m3x9b5f1"
  string code = 3;
  // DisplayName 前端展示名称，根据用户的语言环境，自动转换为相应区域的语言说明
  // 用于角色名称的多语言显示，便于不同地区用户理解角色含义
  string display_name = 4;
  // SortOrder 角色排序顺序，用于同级角色的显示顺序
  // 数值越小排序越靠前，建议使用 10 的倍数便于后续插入
  // 默认值：100，范围：1-9999
  int32 sort_order = 5;

  // Type 角色类型枚举，定义角色的来源和管理方式
  // 用于区分不同类型的角色，影响角色的可编辑性和权限管理策略
  enum Type {
    TYPE_UNSPECIFIED = 0;  // 默认值／未指定类型：系统默认值，通常不直接使用
    SYSTEM = 1;       // 系统内置角色：由系统预定义，不可删除，权限固定
    CUSTOM = 2;       // 自定义角色：用户创建的角色，可完全自定义权限
    TEMPLATE = 3;     // 模板角色：预设的角色模板，可基于此创建新角色
  }
  // type 角色类型，决定角色的管理策略和可操作性
  Type type = 6;

  // Status 角色状态枚举，控制角色的可用性和生命周期
  // 用于角色的启用/禁用管理，影响用户权限的实际生效
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 默认值／未知状态：系统默认值，通常不直接使用
    ACTIVE = 1;       // 正常启用状态：角色正常可用，权限生效
    DISABLED = 2;     // 禁用状态：角色被停用，权限不生效
  }
  // status 角色状态，控制角色是否可用和权限是否生效
  Status status = 7;

  // CreatedBy 创建者用户ID，记录部门创建人
  // 用于审计追踪和权限验证
  int64 created_by = 8;
  
  // UpdatedBy 最后更新者用户ID，记录最近修改人
  // 用于变更追踪和责任确认
  int64 updated_by = 9;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;

  string description = 12;

  // Children 直接子角色列表，用于构建完整的角色树
  repeated Role children = 13;
}

// Group 群组实体，表示一类相同维度的用户集合，扁平结构不支持树形
// 该模型用于描述系统中各类用户分组，支持多维度的用户组织与管理
message Group {
  // ID 群组 ID，全局唯一标识
  int64 id = 1;
  // Code 系统标识符，创建后不可修改
  // 规则：以小写字母开头，仅包含小写字母、数字和连字符，不允许连续连字符，以字母或数字结尾
  // 长度：2-32 字符；如客户端未提供，服务端自动生成 12 位随机编码
  // 示例：手动 "dev-team"、"project-alpha"；自动 "a7k2m3x9b5f1"
  string code = 2;

  // Type 群组类型，标识群组的业务用途
  // 群组类型，用于区分不同用途的群组
  enum Type {
    TYPE_UNSPECIFIED = 0;  // 默认值/未指定：系统默认值，通常不直接使用

    // 1. 组织架构型 (Administrative/Organizational)
    // 逻辑：反映公司真实的行政隶属关系。通常与组织架构同步。
    DEPARTMENT = 1;

    // 2. 角色/权限型 (Role/Permission)
    // 逻辑：纯粹为了授权而存在。例如 "财务审批组"、"代码库管理员组"。
    // 这种组不一定对应行政部门，而是跨部门的权限集合。
    ROLE = 2;

    // 3. 自动化/动态规则型 (Dynamic/Attribute-based)
    // 逻辑：成员不是手动添加的，而是根据 user 的属性（如 "JobTitle == 'Manager' AND City == 'Shanghai'"）自动维护。
    DYNAMIC = 3;

    // 4. 系统内置型 (System/Built-in)
    // 逻辑：系统预设，不可删除。例如 "Everyone" (全员组)、"Authenticated Users"。
    SYSTEM = 4;

    // 5. 项目/任务型 (Project/Workstream)
    // 逻辑：为了完成特定目标而临时或长期建立的协同组织。有明确的生命周期（结束后归档）。
    PROJECT = 5;

    // 6. 外部协作型 (External/Guest)
    // 逻辑：用于管理外部供应商、合作伙伴、客户。在权限审计时通常需要特殊标记。
    EXTERNAL = 6;

    // 7. 虚拟/兴趣小组 (Virtual/Community)
    // 逻辑：非正式组织，如“技术委员会”、“羽毛球协会”，通常用于非核心业务的通知和交流。
    COMMUNITY = 7;
  }
  Type type = 3;

  // Status 群组状态，控制群组的可用状态
  // 群组状态（枚举值预计不会太频繁变化）
  // 可以根据业务再增加状态
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 默认值／未知状态：系统默认值，通常不直接使用
    PENDING = 1;      // 待激活／待验证：创建后等待审核或激活的状态
    ACTIVE = 2;       // 正常启用状态：群组正常运行中，可以进行成员管理和权限分配
    ARCHIVED = 3;     // 被归档，但可查询：群组不再活跃但保留历史数据，成员不允许变更
    DISABLED = 4;     // 禁用，不可查询：群组被临时停用，通常为人工操作结果
  }
  Status status = 4;

  // DisplayName 前端展示名称，根据用户的语言环境，自动转换为相应区域的语言说明
  // 用于群组名称的多语言显示，提升群组管理的用户体验和可读性
  string display_name = 5;
  // SortOrder 群组排序顺序，用于群组在列表中的显示顺序（扁平结构）
  // 数值越小排序越靠前，建议使用 10 的倍数便于后续插入
  // 默认值：100，范围：1-9999
  int32 sort_order = 6;
  // MaxMembers 群组最大成员数量限制，0表示不限制
  int32 max_members = 8;
  // Metadata 元数据，用于存储自定义属性，支持业务扩展
  map<string, string> metadata = 9;
  // Description 群组描述，详细说明群组的目的和用途
  string description = 12;
  // CreatedBy 群组创建者/所有者ID，记录创建该群组的用户
  int64 created_by = 13;
  // UpdatedBy 群组最后更新者，记录最后修改该群组的用户
  int64 updated_by = 14;
  // CreatedAt 创建时间，记录群组的创建时间戳
  google.protobuf.Timestamp created_at = 15;
  // UpdatedAt 更新时间，记录群组的最后修改时间戳
  google.protobuf.Timestamp updated_at = 16;
  // DeletedAt 软删除时间戳，非空表示已删除，空值表示正常状态
  google.protobuf.Timestamp deleted_at = 17;

  // Visibility 群组可见性，控制群组是否对外可见
  Visibility visibility = 18;

  // RefID 类型关联引用ID，根据 type 赋予不同语义：
  //   DEPARTMENT → 关联部门ID (departments.id)
  //   ROLE       → 关联角色ID (roles.id)
  //   其他类型   → 0
  int64 ref_id = 20;

  // RefExpr 类型关联表达式，根据 type 赋予不同语义：
  //   DYNAMIC  → 成员过滤规则，如 "user_type = 10 AND user_status = 3"
  //   SYSTEM   → 同 DYNAMIC，成员过滤规则（系统内置，创建后不可修改）
  //   EXTERNAL → 外部源描述(JSON)，如 {"external_id":"ldap-001","external_source":"ldap"}
  //   其他类型 → 空字符串
  string ref_expr = 21;
}

// Membership 统一成员关系实体
// 用于描述用户与任意组织实体（群组、部门等）之间的关联关系
// 支持多状态管理、角色定义、成员类型区分和审计追踪
message Membership {
  // ID 成员关系唯一标识符，系统自动生成
  int64 id = 1;

  // UserID 用户唯一标识符，建立与用户实体的关联
  int64 user_id = 2;

  // Username 用户名，冗余字段，避免频繁关联查询
  string username = 3;

  // Nickname 用户昵称或显示名称
  string nickname = 4;

  // TargetType 关联目标类型，区分成员属于哪种组织实体
  enum TargetType {
    TARGET_TYPE_UNSPECIFIED = 0;  // 未指定
    GROUP = 1;                    // 群组
    DEPARTMENT = 2;               // 部门
  }
  TargetType target_type = 5;

  // TargetID 关联目标的 ID（群组ID 或 部门ID）
  // 与 target_type 配合使用，确定具体的关联实体
  int64 target_id = 6;

  // Role 用户在目标实体中的角色
  // 不同 target_type 下使用不同的角色子集
  // - GROUP 场景常用: OWNER, ADMIN, MEMBER, GUEST
  // - DEPARTMENT 场景常用: OWNER, DEPUTY, MANAGER, SUPERVISOR, LEAD, SENIOR, MEMBER, INTERN, CONSULTANT, CONTRACTOR, ASSISTANT
  enum Role {
    ROLE_UNSPECIFIED = 0;  // 未指定角色（系统默认值）
    OWNER = 1;             // 所有者/负责人 - 拥有最高管理权限
    ADMIN = 2;             // 管理员 - 管理成员和基本设置
    MEMBER = 3;            // 普通成员 - 拥有基本访问权限
    GUEST = 4;             // 访客 - 拥有受限访问权限
    DEPUTY = 5;            // 副负责人 - 协助负责人管理
    MANAGER = 6;           // 经理 - 负责具体业务管理和团队领导
    SUPERVISOR = 7;        // 主管 - 负责日常业务监督和指导
    LEAD = 8;              // 组长 - 负责小组或项目的直接管理
    SENIOR = 9;            // 高级成员 - 资深员工
    INTERN = 10;           // 实习生 - 临时学习和工作的人员
    CONSULTANT = 11;       // 顾问 - 提供专业建议和指导
    CONTRACTOR = 12;       // 外包人员 - 临时合作的外部人员
    ASSISTANT = 13;        // 助理 - 提供行政和事务支持
  }
  Role member_role = 7;

  // Status 成员关系状态，管理成员的生命周期
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 未指定状态（系统默认值）
    PENDING = 1;             // 待审批 - 申请加入等待审批
    ACTIVE = 2;              // 正常状态 - 正式成员，拥有完整权限
    INVITED = 3;             // 被邀请 - 收到邀请但尚未回应
    DISABLED = 4;            // 已禁用 - 临时限制权限
    REJECTED = 5;            // 被拒绝 - 申请或邀请被拒绝
    LEFT = 6;                // 已退出 - 主动退出或离职
    SUSPENDED = 7;           // 已暂停 - 临时暂停，如休假、停职等
    TRANSFERRING = 8;        // 调动中 - 正在进行组织间调动的过渡状态
  }
  Status member_status = 8;

  // MemberType 成员关系类型，区分主要归属和兼职关系
  // 主要用于 DEPARTMENT 场景，GROUP 场景可不填或使用 PRIMARY
  // 【系统约束】：针对同一个 user_id，target_type=DEPARTMENT 时，只能有一条 member_type=PRIMARY 的记录
  enum MemberType {
    MEMBER_TYPE_UNSPECIFIED = 0;  // 未指定
    PRIMARY = 1;                   // 主要关系 - 用户的主要工作、汇报、考勤归属
    DUAL = 2;                      // 兼职关系 - 协作、项目或次要行政隶属
    ADVISORY = 3;                  // 顾问关系 - 仅提供指导或临时服务
  }
  MemberType member_type = 9;

  // JoinedAt 用户加入的时间
  google.protobuf.Timestamp joined_at = 10;

  // ExpiredAt 关系有效期，用于临时成员管理，空表示永久有效
  google.protobuf.Timestamp expired_at = 11;

  // CreatedBy 创建者用户ID
  int64 created_by = 12;

  // UpdatedBy 最后更新者用户ID
  int64 updated_by = 13;

  // CreatedAt 关系创建时间
  google.protobuf.Timestamp created_at = 14;

  // UpdatedAt 关系最后更新时间
  google.protobuf.Timestamp updated_at = 15;

  // Metadata 扩展元数据，键值对格式，支持灵活的业务扩展
  map<string, string> metadata = 16;

  // Description 详细说明信息
  string description = 17;
}

// AuthProvider 身份提供商实体，验证用户登录时使用的第三方服务
message AuthProvider {
  // ======== 标识区（1-4） ========

  // ID 全局唯一标识
  int64 id = 1;
  // Code 系统标识符，创建后不可修改
  // 规则：以小写字母开头，仅包含小写字母、数字和连字符，不允许连续连字符，以字母或数字结尾
  // 长度：2-32 字符；如客户端未提供，服务端自动生成 12 位随机编码
  // 示例：手动 "github"、"corp-ldap"；自动 "a7k2m3x9b5f1"
  string code = 2;

  // Type 身份提供商类型
  enum Type {
    TYPE_UNSPECIFIED = 0;
    LOCAL = 1;
    LDAP = 2;
    OIDC = 3;
    OAUTH2 = 4;
    GITHUB = 5;
    GOOGLE = 6;
    WECHAT = 7;
  }
  Type type = 3;

  // Status 身份提供商状态，控制提供商的可用性和生命周期
  enum Status {
    STATUS_UNSPECIFIED = 0; // 未指定状态
    ACTIVE = 1;             // 启用中 - 可用于用户登录认证
    DISABLED = 2;           // 已禁用 - 暂停认证服务，可重新启用
    PENDING = 3;            // 待配置/待验证 - 配置未完成或等待连通性验证
  }
  Status status = 4;

  // ======== 展示区（5-8） ========

  // DisplayName 身份提供商展示名称，用于登录界面等用户可见场景
  // 示例："使用 GitHub 登录"、"企业 LDAP 认证"
  string display_name = 5;
  // Description 身份提供商描述信息，详细说明该提供商的用途和适用范围
  string description = 6;
  // SortOrder 排序权重，控制提供商在登录页面的展示顺序
  // 数值越小排序越靠前，建议使用 10 的倍数便于后续插入
  // 默认值：100，范围：1-9999
  int32 sort_order = 7;
  // IconURL 提供商图标地址，用于登录页面展示
  string icon_url = 8;

  // ======== 类型特有配置区（10-19） ========
  // LOCAL 类型无需额外配置，不设置 config 即可

  oneof config {
    // LDAP 身份提供商配置，仅 type=LDAP 时使用
    LdapConfig  ldap_config  = 10;
    // OAuth2 系身份提供商通用配置
    // 适用于 type=OIDC/OAUTH2/GITHUB/GOOGLE/WECHAT
    OAuthConfig oauth_config = 11;
  }

  // ======== 审计区（20-24） ========

  // CreatedBy 创建者用户ID，记录该提供商的创建人
  int64 created_by = 20;
  // UpdatedBy 最后更新者用户ID，记录最近修改人
  int64 updated_by = 21;
  // CreatedAt 创建时间戳
  google.protobuf.Timestamp created_at = 22;
  // UpdatedAt 最后更新时间戳
  google.protobuf.Timestamp updated_at = 23;
  // DeletedAt 软删除时间戳，非空表示已删除
  google.protobuf.Timestamp deleted_at = 24;
}

// LdapConfig LDAP 身份提供商配置
message LdapConfig {
  // Host LDAP 服务器地址，如 "ldap.corp.com"
  string host = 1;
  // Port LDAP 服务端口，默认 389，TLS 模式为 636
  int32 port = 2;
  // UseTLS 是否启用 TLS（LDAPS）
  bool use_tls = 3;
  // StartTLS 是否使用 StartTLS 升级连接
  bool start_tls = 4;
  // InsecureSkipVerify 是否跳过 TLS 证书验证（仅测试环境）
  bool insecure_skip_verify = 5;
  // BindDN 绑定 DN，用于搜索用户的服务账号
  // 示例: "cn=admin,dc=corp,dc=com"
  string bind_dn = 6;
  // BindPassword 绑定密码（敏感字段，List/Get 默认不返回，需 VIEW_FULL 权限）
  string bind_password = 7;
  // UserSearchBase 用户搜索基准 DN
  // 示例: "ou=people,dc=corp,dc=com"
  string user_search_base = 8;
  // UserSearchFilter 用户搜索过滤器
  // 示例: "(uid={{.Username}})" 或 "(sAMAccountName={{.Username}})"
  string user_search_filter = 9;
  // UsernameAttribute 用户名映射属性，如 "uid"、"sAMAccountName"
  string username_attribute = 10;
  // EmailAttribute 邮箱映射属性，如 "mail"
  string email_attribute = 11;
  // DisplayNameAttribute 显示名映射属性，如 "cn"、"displayName"
  string display_name_attribute = 12;
  // GroupSearchBase 群组搜索基准 DN（可选）
  string group_search_base = 13;
  // GroupSearchFilter 群组搜索过滤器（可选）
  // 示例: "(member={{.UserDN}})"
  string group_search_filter = 14;
}

// OAuthConfig OAuth2 系身份提供商通用配置
// 适用于 OIDC、OAUTH2、GITHUB、GOOGLE、WECHAT 等类型
// 服务端根据 AuthProvider.type 决定具体认证流程和默认值
message OAuthConfig {
  // === 核心字段（所有 OAuth2 类型通用）===

  // ClientID 客户端标识
  // 微信场景对应 AppID，其他场景对应 OAuth2 Client ID
  string client_id = 1;
  // ClientSecret 客户端密钥（敏感字段，List/Get 默认不返回，需 VIEW_FULL 权限）
  // 微信场景对应 AppSecret
  string client_secret = 2;
  // RedirectURI 授权回调地址
  string redirect_uri = 3;
  // Scopes 授权范围
  // OIDC 默认 ["openid", "profile", "email"]
  // GitHub 默认 ["user:email"]
  // 微信默认 ["snsapi_login"]
  repeated string scopes = 4;

  // === 端点配置 ===
  // OIDC 模式下可通过 issuer 自动发现，以下端点为可选覆盖
  // OAUTH2 模式下以下端点为必填
  // GITHUB/GOOGLE/WECHAT 模式下服务端内置默认值，通常无需填写

  // AuthorizationEndpoint 授权端点
  string authorization_endpoint = 5;
  // TokenEndpoint 令牌端点
  string token_endpoint = 6;
  // UserinfoEndpoint 用户信息端点
  string userinfo_endpoint = 7;

  // === OIDC 特有 ===

  // Issuer OIDC 签发方标识，用于 .well-known/openid-configuration 自动发现
  // 仅 OIDC 类型必填，其他类型忽略
  // 示例: "https://accounts.google.com"
  string issuer = 10;
  // JwksURI JWKS 端点，用于验证 ID Token 签名（可选，覆盖自动发现）
  string jwks_uri = 11;

  // === 通用 OAuth2 特有（字段映射）===

  // UserinfoIdField 用户信息响应中用户唯一标识字段名，默认 "sub"
  // 仅 OAUTH2 类型需要显式指定，OIDC/GITHUB/GOOGLE/WECHAT 服务端已内置
  string userinfo_id_field = 15;
  // UserinfoNameField 用户信息响应中用户名字段名，默认 "name"
  string userinfo_name_field = 16;
  // UserinfoEmailField 用户信息响应中邮箱字段名，默认 "email"
  string userinfo_email_field = 17;

  // === GitHub 特有 ===

  // AllowedOrganizations 限制允许登录的 GitHub 组织（可选）
  // 仅 GITHUB 类型生效，为空表示不限制
  repeated string allowed_organizations = 20;
  // ApiURL GitHub API 地址，默认 "https://api.github.com"
  // GitHub Enterprise 可自定义，如 "https://github.corp.com/api/v3"
  string api_url = 21;

  // === Google 特有 ===

  // HostedDomain 限制为特定 Google Workspace 域名（可选）
  // 仅 GOOGLE 类型生效，如 "example.com"
  string hosted_domain = 25;

  // === 微信特有 ===

  // AgentID 企业微信 AgentId（企业微信场景必填）
  // 仅 WECHAT 类型生效
  string agent_id = 30;
  // IsEnterprise 是否为企业微信模式（端点和认证流程不同）
  // 仅 WECHAT 类型生效
  bool is_enterprise = 31;

  // === 通用安全选项 ===

  // InsecureSkipVerify 是否跳过 TLS 证书验证（仅测试环境使用）
  bool insecure_skip_verify = 40;
}

// 企业级通用凭证定义
// 支持 API Key、X.509 证书、非对称密钥对、HMAC/对称密钥、JWKS、软件许可证等多种凭证类型
// 提供分层管理：类型、算法、用途、可见性、来源、策略、审计和元数据
message Credential {
  // API 密钥结构
  message ApiKeyData {
    string api_key = 1;    // API Key 的公有标识
    bytes api_secret = 2;  // API Secret / 私密部分，敏感数据
  }

  // 非对称密钥对
  message KeyPairData {
    bytes public_key = 1;   // 公钥内容（PEM/DER 格式）
    bytes private_key = 2;  // 私钥内容（PEM/DER 格式），敏感数据
    bytes passphrase = 3;   // 私钥加密口令，可选
  }

  // X.509 证书捆绑数据
  message X509Data {
    bytes certificate = 1;       // 主证书（PEM/DER 格式）
    bytes private_key = 2;       // 对应私钥（PEM/DER 格式），敏感数据，可选
    repeated bytes ca_chain = 3; // 可选 CA 证书链（顺序从根到中间证书）
  }

  // 软件许可证
  message LicenseData {
    string license_key = 1;  // 许可证密钥或主体内容
    string signature = 2;    // 许可证数字签名，用于验证完整性
  }

  // 凭证类型（载体/结构）
  enum Type {
    TYPE_UNSPECIFIED = 0;     // 未指定类型
    API_KEY = 1;         // API Key
    SYMMETRIC_KEY = 2;   // 对称密钥 / HMAC / AES
    KEY_PAIR = 3;        // 公私钥对
    X509 = 4;            // X.509 证书凭证（包含主证书、私钥、CA链）
    LICENSE = 5;         // 软件许可证
    JWKS = 6;            // JSON Web Key Set URI / 内容
    HSM_REF = 7;         // 外部安全模块 (KMS/HSM) 引用
    FIDO = 8;            // 硬件安全密钥 / 多因素认证设备
    // OTHER = 99;          // 未来扩展自定义类型
  }

  // 算法类型枚举
  enum Algorithm {
    ALGORITHM_UNSPECIFIED = 0; // 未指定

    // 非对称签名/加密算法
    RSA = 1;          // RSA 公私钥算法
    ECDSA = 2;        // ECDSA 椭圆曲线签名算法
    ED25519 = 3;      // Ed25519 高性能椭圆曲线签名算法

    // 对称签名 / HMAC
    HMAC = 4;         // HMAC 对称签名算法，hash 类型可在 metadata 指定 (SHA256, SHA512, SHA3 等)

    // 对称加密算法
    AES = 5;          // AES 对称加密算法，可在 metadata 指定 key 长度 (128/256) 和模式 (GCM/CBC 等)
    CHACHA20_POLY1305 = 6; // ChaCha20-Poly1305 对称加密 + 完整性验证，高性能

    // 国密 / 自定义算法
    // OTHER = 99;       // 自定义算法或国密算法（如 SM2/SM3/SM4 或企业自研算法）
  }

  // 凭证用途
  enum Usage {
    USAGE_UNSPECIFIED = 0; // 未指定用途

    // 技术用途
    SIGNING = 1;     // 数据签名/完整性验证
    ENCRYPTION = 2;  // 数据加密/解密

    // 业务用途
    AUTH = 10;        // 身份认证/授权
    // LICENSE = 11;     // 软件许可证验证
    OTP = 12;         // 一次性密码 / TOTP
  }

  // 凭证状态
  enum Status {
    STATUS_UNSPECIFIED = 0; // 未指定状态
    ACTIVE = 1;      // 有效且正在使用
    PENDING = 2;     // 待激活/待验证
    DISABLED = 3;    // 手动禁用
    EXPIRED = 4;     // 已过期
    REVOKED = 5;     // 已吊销/废弃
  }

  // 凭证来源
  enum Source {
    SOURCE_UNSPECIFIED = 0; // 未指定
    SYSTEM = 1;      // 系统自动生成
    USER = 2;        // 用户创建
    KMS = 3;         // KMS/HSM 生成
    EXTERNAL = 4;    // 外部导入
  }

  int64 id = 1;             // 凭证唯一 ID
  // Code 系统标识符，创建后不可修改
  // 规则：以小写字母开头，仅包含小写字母、数字和连字符，不允许连续连字符，以字母或数字结尾
  // 长度：2-32 字符；如客户端未提供，服务端自动生成 12 位随机编码
  // 示例：手动 "api-signing-key"、"tls-cert"；自动 "a7k2m3x9b5f1"
  string code = 2;

  Type type = 3;             // 凭证类型
  Algorithm algorithm = 4;   // 技术算法
  Usage usage = 5;           // 业务用途
  Visibility visibility = 6; // 可见性
  Status status = 7;         // 当前状态
  Source source = 8;         // 凭证来源

  string key_id = 9;         // 外部系统 Key ID / JWKS ID / HSM ID

  // oneof: 核心密钥材料（互斥存储）
  oneof key_material {
    ApiKeyData api_key = 10;                // API Key
    KeyPairData key_pair = 11;              // 公私钥对
    X509Data x509_data = 12;   // X.509 证书数据
    LicenseData license = 13;                // 软件许可证
    bytes symmetric_key = 14;              // 对称密钥 / HMAC / JWT
    string jwks_uri = 15;                    // JWKS URI
  }

  // 时间相关字段
  google.protobuf.Timestamp not_before = 17; // 生效时间（Not Before）
  google.protobuf.Timestamp expires_at = 18; // 过期时间
  google.protobuf.Timestamp created_at = 19; // 创建时间
  google.protobuf.Timestamp updated_at = 20; // 最后更新时间

  // 审计信息
  int64 created_by = 21; // 创建者用户 ID
  int64 updated_by = 22; // 更新者用户 ID

  // 附加元数据和描述
  map<string, string> metadata = 23; // 自定义业务属性
  string description = 24;           // 凭证说明或备注
}

message OAuth2JSONWebKeys {
  message Key {
    string kty = 1;
    string use = 2;
    string alg = 3;
    string e = 4;
    string n = 5;
    string kid = 6;
  }

  repeated Key keys = 1;
}

message OAuth2Userinfo {
  // ID 用户 ID，全局唯一标识，使用 int64 序列化为 json 为 string 类型
  int64 user_id = 1;
  // 用户名，系统登录凭证，必须唯一
  string username = 2;
  // 昵称，用于社交或前端展示
  string nickname = 3;
  // 个人简介或签名
  string profile = 4;
  // 用户头像 URL
  string picture = 5;
  // 个人网站地址
  string website = 6;
  // 时区信息（IANA 时区标识，例如 "Asia/Shanghai"）
  string timezone = 7;
  // 用户偏好的语言与地区（例如 "zh-CN"、"en-US"）
  string locale = 8;  
}

// AuthToken 登录成功响应
// 参考 rfc 规范：https://www.rfc-editor.org/rfc/rfc6749#section-5
message AuthToken {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
}