syntax = "proto3";

// 根据具体的微服务名称做更改
package grpc_kit.api.known.admin.v1;

option go_package = "github.com/grpc-kit/pkg/api/known/admin/v1;adminv1";

// 引入 google 公共类型
import "google/protobuf/timestamp.proto";

// enum 参考以下规范 https://google.aip.dev/126
// 包级枚举取值应带枚举名前缀

// 通用：用于所有 List / Get / BatchGet
enum View {
  VIEW_UNSPECIFIED = 0;
  // List 默认
  VIEW_BASIC = 1;
  // 常规详情
  VIEW_STANDARD = 2;
  // 全量
  VIEW_FULL = 3;
}

// 通用：用于任何支持层级 / 关系返回的 List API
enum Structure {
  STRUCTURE_UNSPECIFIED = 0;
  // 平铺列表（默认），支持分页
  STRUCTURE_FLAT = 1;
  // 层级结构（父子），不支持分页
  STRUCTURE_TREE = 2;
  // 层级结构 + 全展开，不支持分页
  STRUCTURE_TREE_EXPANDED = 3;
}

// 可见性是“前置过滤”，权限是“后置校验”
// 通用：部门/资源/凭证的可见性策略
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;

  // 全开：跨部门、跨层级全局可见
  // 资源/部门：系统中所有合法用户均可检索/看到
  VISIBILITY_GLOBAL = 1;

  // 组织架构树可见：本部门及下属部门可见（向下递归）
  // 部门：成员处于相同节点或上级节点可见其下属节点（不管下级节点设置的可见性）
  // 资源：同部门及子部门成员可见
  VISIBILITY_SUBTREE = 2;

  // 仅本级可见：仅限本部门成员，不包含子部门
  // 部门：仅同级成员可见，不向下扩散
  // 资源：仅本节点成员可见
  VISIBILITY_LOCAL = 3;

  // 私有：仅创建者/负责人及系统内部可见（最严限制）
  // 部门：同级成员也不可见，仅管理员或特定负责人可见
  // 资源：仅创建者或指定授权人可见
  VISIBILITY_RESTRICTED = 4;

  // 特定受众：基于白名单（如特定团队、特定角色）
  // 如果逻辑复杂，通常此项作为占位，具体配置存入关联表
  VISIBILITY_SPECIFIC = 5;
}

// Address 用户地址
// https://openid.net/specs/openid-connect-core-1_0.html#AddressClaim
message Address {
  string country = 1;
  string postal_code = 2;
  string region = 3;
  string locality = 4;
  string street_address = 5;
}

// PhoneNumber 手机号，以 E.164 格式存储（E.164 = '+' + 国家码 + 本地号码）总长度 ≤ 15 位，如：+8613812345678
message PhoneNumber {
  // 国家码，字符串更通用，例如 "86", "1"
  string country_code = 1;
  // 本地号码，字符串存储，避免丢失前导零
  string national_number = 2;
}

// Department 组织部门实体，支持树形层级结构的企业组织架构管理
// 设计原则：一个用户仅可归属于一个主部门，但可通过角色关系参与多个部门的管理
// 支持国际化、状态管理、财务集成等企业级功能
message Department {
  // ID 部门唯一标识符，系统自动生成
  // 用于数据库主键和跨系统引用，建议使用自增整型
  int64 id = 1;
  
  // ParentID 父部门ID，构建树形组织结构
  // 值为 0 表示顶级部门（如：总公司、集团总部）
  // 支持多级嵌套，建议层级深度不超过 6 级以保证查询性能
  int64 parent_id = 2;
  
  // Name 部门系统标识符，仅支持英文字符，用于权限表关联和系统内部逻辑
  // 要求：长度 1-100 字符，仅支持英文字母、数字和下划线，同级部门标识符不可重复
  // 示例："tech_dept"、"marketing_dept"、"hr_dept"
  // 注意：此字段创建后不支持修改，以确保权限关联的稳定性
  string code = 3;
  
  // DisplayName 前端展示名称，根据用户的语言环境，自动转换为相应区域的语言说明
  // 用于部门名称的多语言显示，提升用户体验和国际化支持
  string display_name = 4;
  
  // Type 部门类型分类，用于业务逻辑和权限控制
  enum Type {
    TYPE_UNSPECIFIED = 0;  // 未指定类型
    BUSINESS = 1;     // 业务部门 - 直接产生收入的核心业务单位
    SUPPORT = 2;      // 支持部门 - 为业务部门提供服务支撑（如：IT、HR）
    MANAGEMENT = 3;   // 管理部门 - 负责决策和监督的管理层级
    VIRTUAL = 4;      // 虚拟部门 - 项目组、临时团队等非固定组织
  }
  Type type = 5;

  // Status 部门运营状态，用于生命周期管理
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 未指定状态（系统默认值）
    ACTIVE = 1;       // 正常运营 - 部门正常工作，可分配员工和任务
    INACTIVE = 2;     // 暂停运营 - 临时停止业务，员工可能被临时调配
    DISSOLVED = 3;    // 已解散 - 部门正式撤销，员工需重新分配
    MERGING = 4;      // 合并中 - 正在与其他部门合并，处于过渡状态
  }
  Status status = 6;

  // SortOrder 部门排序顺序，用于同级部门的显示顺序
  // 数值越小排序越靠前，建议使用 10 的倍数便于后续插入
  // 默认值：100，范围：1-9999
  int32 sort_order = 7;
  
  // Members 部门成员列表
  repeated DepartmentMember members = 8;

  // Children 直接子部门列表，用于构建完整的组织树
  // 仅包含直接下级，避免深度递归查询
  // 建议在需要完整树结构时通过专门的服务接口获取
  repeated Department children = 9;

  // Email 部门公共邮箱地址，用于对外联系和内部通知
  // 格式：标准邮箱格式，如 "tech@company.com"
  // 用途：部门公告、外部合作、客户联系等
  string email = 10;

  // PhoneNumber 部门联系电话，支持国际化电话号码格式
  // 包含国家代码、区号、号码等完整信息
  // 用于紧急联系、业务咨询等场景
  PhoneNumber phone_number = 11;

  // Address 部门办公地址，支持结构化地址信息
  // 包含国家、省市、详细地址等信息
  // 用于邮寄、拜访、资产管理等业务场景
  Address address = 12;

  // CostCenterCode 成本中心编码，用于财务核算和成本控制
  // 格式：企业自定义编码规则，如 "CC-TECH-001"
  // 用途：预算分配、成本归集、财务报表等
  // 与 ERP 系统集成时的重要标识字段
  string cost_center_code = 13;
  
  // BudgetCode 预算编码，用于预算管理和费用控制
  // 格式：与财务系统对应的预算科目编码
  // 用途：年度预算、费用审批、财务分析等
  // 支持多维度预算管理（如：人员预算、设备预算等）
  string budget_item_code = 14;

  // MaxMembers 部门最大成员数限制，用于人员规模控制
  // 值为 0 表示无限制，正整数表示具体限制
  // 用途：组织规模控制、人力成本管理、办公空间规划
  int32 max_members = 15;
  
  // ExternalID 外部系统标识符，用于第三方系统集成
  // 如：ERP 系统部门编码、OA 系统部门 ID 等
  // 支持数据同步和跨系统业务流程
  string external_id = 16;
  
  // Metadata 扩展元数据，存储自定义业务属性
  // 键值对格式，支持灵活的业务扩展需求
  // 示例：{"location": "北京", "floor": "15F", "capacity": "50"}
  map<string, string> metadata = 17;

  // CreatedBy 创建者用户ID，记录部门创建人
  // 用于审计追踪和权限验证
  int64 created_by = 18;
  
  // UpdatedBy 最后更新者用户ID，记录最近修改人
  // 用于变更追踪和责任确认
  int64 updated_by = 19;
  
  // CreatedAt 创建时间戳，记录部门建立时间
  // 使用 UTC 时间，精确到毫秒级别
  google.protobuf.Timestamp created_at = 20;
  
  // UpdatedAt 最后更新时间戳，记录最近修改时间
  // 用于数据同步和缓存失效判断
  google.protobuf.Timestamp updated_at = 21;
  
  // DeletedAt 软删除时间戳，支持数据恢复
  // 非空表示已删除，空值表示正常状态
  // 实现软删除机制，保护重要组织数据
  google.protobuf.Timestamp deleted_at = 22;

  // Description 部门描述信息，详细说明部门职责和业务范围
  // 用于组织介绍、职责说明、业务范围描述等
  // 建议长度：500 字符以内，支持富文本格式
  string description = 23;

  // Visibility 部门及成员列表的可见性策略（使用公共枚举 Visibility）
  Visibility visibility = 24;
}

// Scope 作用域
message Scope {
  // ID 资源 ID
  int64 id = 1;

  // Type 作用域类型
  enum Type {
    TYPE_UNSPECIFIED = 0;
    /*
      admin   后台管理端
      user    前台用户端
      app     移动端
     */
    PLATFORM = 1; // admin, user, app

    /*
      readonly
      readwrite
     */
    ACTION = 2;
  }
  Type type = 2;

  // Name 作用域系统标识符，仅支持英文字符，用于权限表关联和系统内部逻辑
  // 默认存在以下内部作用域：
  // admin 后天用户菜单查看权限
  // user 前端用户菜单查看权限
  string code = 3;
  string display_name = 4;

  string description = 5;
}

// Resource 资源定义，如：菜单等
message Resource {
  // ID 资源 ID
  int64 id = 1;
  // ParentID 父资源 ID，为 0 表示顶级资源
  int64 parent_id = 2;
  // Name 资源系统标识符，仅支持英文字符，用于权限表关联和系统内部逻辑
  // 要求：仅支持英文字母、数字和下划线，全局唯一标识符
  // 示例："user_management"、"role_admin"、"system_config"
  // 注意：此字段创建后不支持修改，以确保权限关联的稳定性
  string code = 3;
  // DisplayName 前端展示名称，根据用户的语言环境，自动转换为相应区域的语言说明
  // 用于资源名称的多语言显示，支持菜单、按钮等界面元素的国际化
  string display_name = 4;
  // SortOrder 资源排序顺序，用于同级资源的显示顺序
  // 数值越小排序越靠前，建议使用 10 的倍数便于后续插入
  // 默认值：100，范围：1-9999
  int32 sort_order = 5;

  // Type 资源类型
  enum Type {
    TYPE_UNSPECIFIED = 0;
    MENU    = 1; // 菜单（页面入口，会在菜单栏中显示）
    PAGE    = 2; // 页面（路由级，不会在菜单栏中显示）
    BUTTON  = 3; // 按钮 / UI 操作
    API     = 4; // 后端接口（包含 grpc、http 等）
    DATA    = 5; // 数据级资源（行 / 字段）
    SYSTEM  = 6; // 系统级 / 非 UI 资源（如：系统设置、系统日志等）
  }
  Type type = 6;
  
  // Status 资源状态
  enum Status {
    STATUS_UNSPECIFIED = 0;

    ENABLED = 1; // 启用
    DISABLED = 2; // 禁用
  }
  Status status = 7;

  // Enabled 资源是否启用
  // bool enabled = 8;
  // Hidden 是否在资源列表中隐藏
  // bool hidden = 9;
  // HideChildren 是否在资源列表中隐藏子项
  // bool hide_children = 10;

  // Visibility 资源可见性/展示策略（使用公共枚举 Visibility）
  Visibility visibility = 8;

  // Locator 资源路径，我怎么找到你
  string locator = 11;
  // visual 资源图标，我怎么看到你
  string visual = 12;
  // Manifest 资源描述，我怎么用你
  string manifest = 13;
  // Metadata 扩展元数据
  // 用于存储上述三个核心字段无法涵盖的特定平台/业务属性
  map<string, string> metadata = 14;

  // Children 子资源列表
  repeated Resource children = 15;

  repeated Scope scopes = 16;

  string description = 17;

  // CreatedBy 创建者用户ID，记录部门创建人
  // 用于审计追踪和权限验证
  int64 created_by = 18;
  
  // UpdatedBy 最后更新者用户ID，记录最近修改人
  // 用于变更追踪和责任确认
  int64 updated_by = 19;

  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

// Policy 策略定义
message Policy {
  // ID 资源 ID
  int64 id = 1;

  // Type 策略类型
  enum Type {
    TYPE_UNSPECIFIED = 0;
    ROLE = 1;
    OPEN_POLICY_AGENT = 2;
  }
  Type type = 2;

  // Status 策略状态，用于生命周期管理
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 未指定状态（系统默认值）

    // ===== 正常生命周期 =====
    DRAFT = 1;        // 草稿：未生效，仅用于编辑/评审
    ENABLED = 2;      // 已启用：正在参与授权决策
    DISABLED = 3;     // 已禁用：保留配置，但不参与决策

    // ===== 变更 / 风险控制 =====
    PENDING = 4;     // 待生效：已配置，等待审批或时间触发
    SUSPENDED = 5;   // 已挂起：紧急风控临时冻结（可自动/人工）

    // ===== 生命周期结束 =====
    DEPRECATED = 6;  // 已废弃：不推荐使用，允许已有绑定
    ARCHIVED = 7;    // 已归档：只读，仅审计/历史查询
  }
  Status status = 3;

  // Name 策略系统标识符，仅支持英文字符，用于权限表关联和系统内部逻辑
  // 要求：仅支持英文字母、数字和下划线，全局唯一标识符
  // 注意：此字段创建后不支持修改，以确保权限关联的稳定性
  string code = 4;

  // DisplayName 前端展示名称，根据用户的语言环境，自动转换为相应区域的语言说明
  string display_name = 5;

  // Value 策略值，根据策略类型不同，表示不同的含义
  string value = 6;

  // Description 策略描述，详细说明策略职责和业务范围
  string description = 7;
}

message Permission {
  // ID 资源 ID
  int64 id = 1;
  string code = 2;
  string display_name = 3;

  Policy policy = 4;

  // 废弃，使用 Binding 替代
  repeated Resource resources = 5;

  string description = 6;

  message Binding {
    int64 id = 1;

    // 资源范围
    int64 resource_scope_id = 2;
    // 是否递归子资源
    bool is_recursive = 3;

    Resource resources = 5;
  }

  // 权限绑定资源集合
  repeated Binding bindings = 7;
}

// User 用户实体，表示系统中的账号信息
message User {
  // 以下字段为非敏感/可直接输出（适合公开展示或普通资料页）

  // ID 用户 ID，全局唯一标识，使用 int64 序列化为 json 为 string 类型
  int64 id = 1;
  // 用户名，系统登录凭证，必须唯一
  string username = 2;
  // 昵称，用于社交或前端展示
  string nickname = 3;
  // 个人简介或签名
  string profile = 4;
  // 用户头像 URL
  string picture = 5;
  // 个人网站地址
  string website = 6;
  // 时区信息（IANA 时区标识，例如 "Asia/Shanghai"）
  string timezone = 7;
  // 用户偏好的语言与地区（例如 "zh-CN"、"en-US"）
  string locale = 8;

  // 以下字段受限输出（仅本人或具备权限的管理员可见，外部或公共接口谨慎返回）

  // 用户的基础身份类型，后端自动维护更新，非人为更新
  enum Type {
    TYPE_UNSPECIFIED = 0;  // 默认值

    // 外部用户 / 业务伙伴
    CUSTOMER = 1;     // 前台用户 / 消费者
    MERCHANT = 2;     // 商户 / 卖家
    SUPPLIER = 3;     // 供应商 / 合作方

    // 内部用户 / 员工
    EMPLOYEE = 10;    // 后台用户 / 内部员工
    ADMIN = 11;       // 系统管理员

    // 系统账户 (为安全和区分，编号拉开)
    SYSTEM = 99;      // 系统集成账户 / 机器人
  }
  Type type = 9;

  // 用户状态（枚举值预计不会太频繁变化）
  // 可以根据业务再增加状态
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 默认值／未知状态
    PENDING = 1;      // 待激活／待验证
    ACTIVE = 2;       // 正常启用状态
    LOCKED = 3;       // 被锁定（如连续密码错误、账号风控等）
    DISABLED = 4;     // 禁用（人工停用）
    EXPIRED = 5;      // 过期等（订阅过期、账号注销等）
    SUSPENDED = 6;   // 暂时冻结（如风控触发、投诉处理中）
    DELETED = 7;     // 已注销（区别软删除）
  }
  Status status = 10;

  // Gender 用户性别
  enum Gender {
    GENDER_UNSPECIFIED = 0;
    MALE = 1;        // 男性
    FEMALE = 2;      // 女性
    OTHER = 3;       // 其他
    PRIVATE = 4;     // 保密，不愿透露
  }
  Gender gender = 11;

  // 邮箱是否已验证
  bool email_verified = 12;
  // 手机号码是否已验证
  bool phone_number_verified = 13;

  // 创建时间
  google.protobuf.Timestamp created_at = 15;
  // 更新时间
  google.protobuf.Timestamp updated_at = 16;
  // 删除时间
  google.protobuf.Timestamp deleted_at = 17;

  // 敏感字段（默认不直接对外输出，需权限并建议脱敏）

  // 真实姓名，用于实名认证或后台展示
  string realname = 19;
  // 身份证号，用于身份验证（可选）
  string national_id = 20;
  // 邮箱地址
  string email = 21;
  // 出生日期
  google.protobuf.Timestamp birthday = 22;
  // 手机号码
  PhoneNumber phone_number = 23;
  // 地址信息
  Address address = 24;

    // CreatedBy 创建者用户ID，记录部门创建人
  // 用于审计追踪和权限验证
  int64 created_by = 25;
  
  // UpdatedBy 最后更新者用户ID，记录最近修改人
  // 用于变更追踪和责任确认
  int64 updated_by = 26;

  // 自定义元数据，用于存储额外的用户信息（如 JSON 字符串）
  map<string, string> metadata = 27;
}

// Role 角色实体，表示用户在系统上的权限和功能
message Role {
  // ID 角色 ID，全局唯一标识
  int64 id = 1;
  // Name 角色系统标识符，仅支持英文字符，用于权限表关联和系统内部逻辑
  // 要求：仅支持英文字母、数字和下划线，全局唯一标识符
  // 示例："admin"、"user_manager"、"guest"
  // 注意：此字段创建后不支持修改，以确保权限关联的稳定性

  // ParentID 父角色ID，构建树形组织结构
  // 值为 0 表示顶级角色（如：系统内置角色）
  // 支持多级嵌套，建议层级深度不超过 3 级以保证查询性能
  int64 parent_id = 2;

  string code = 3;
  // DisplayName 前端展示名称，根据用户的语言环境，自动转换为相应区域的语言说明
  // 用于角色名称的多语言显示，便于不同地区用户理解角色含义
  string display_name = 4;
  // SortOrder 角色排序顺序，用于同级角色的显示顺序
  // 数值越小排序越靠前，建议使用 10 的倍数便于后续插入
  // 默认值：100，范围：1-9999
  int32 sort_order = 5;

  // Type 角色类型枚举，定义角色的来源和管理方式
  // 用于区分不同类型的角色，影响角色的可编辑性和权限管理策略
  enum Type {
    TYPE_UNSPECIFIED = 0;  // 默认值／未指定类型：系统默认值，通常不直接使用
    SYSTEM = 1;       // 系统内置角色：由系统预定义，不可删除，权限固定
    CUSTOM = 2;       // 自定义角色：用户创建的角色，可完全自定义权限
    TEMPLATE = 3;     // 模板角色：预设的角色模板，可基于此创建新角色
  }
  // type 角色类型，决定角色的管理策略和可操作性
  Type type = 6;

  // Status 角色状态枚举，控制角色的可用性和生命周期
  // 用于角色的启用/禁用管理，影响用户权限的实际生效
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 默认值／未知状态：系统默认值，通常不直接使用
    ACTIVE = 1;       // 正常启用状态：角色正常可用，权限生效
    DISABLED = 2;     // 禁用状态：角色被停用，权限不生效
  }
  // status 角色状态，控制角色是否可用和权限是否生效
  Status status = 7;

  // CreatedBy 创建者用户ID，记录部门创建人
  // 用于审计追踪和权限验证
  int64 created_by = 8;
  
  // UpdatedBy 最后更新者用户ID，记录最近修改人
  // 用于变更追踪和责任确认
  int64 updated_by = 9;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;

  string description = 12;

  // Children 直接子角色列表，用于构建完整的角色树
  repeated Role children = 13;
}

// Group 群组实体，表示一类相同维度的用户集合
// 该模型用于描述系统中各类用户分组，支持多维度的用户组织与管理
message Group {
  // ID 群组 ID，全局唯一标识
  int64 id = 1;
  // Name 群组系统标识符，仅支持英文字符，用于权限表关联和系统内部逻辑
  // 要求：仅支持英文字母、数字和下划线，全局唯一标识符
  // 示例："dev_team"、"project_alpha"、"admin_group"
  // 注意：此字段创建后不支持修改，以确保权限关联的稳定性
  string code = 2;

  // Type 群组类型，标识群组的业务用途
  // 群组类型，用于区分不同用途的群组
  enum Type {
    TYPE_UNSPECIFIED = 0;  // 默认值/未指定：系统默认值，通常不直接使用
    DEPARTMENT = 1;   // 部门群组：基于组织架构的部门划分，则 external_id 对应 department_id
    PROJECT = 2;      // 项目群组：基于项目或任务的临时分组
    ROLE = 3;         // 角色群组：基于用户角色或权限的分组
    CUSTOM = 4;       // 自定义群组：用户根据特定业务需求自定义的分组
  }
  Type type = 3;

  // Status 群组状态，控制群组的可用状态
  // 群组状态（枚举值预计不会太频繁变化）
  // 可以根据业务再增加状态
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 默认值／未知状态：系统默认值，通常不直接使用
    PENDING = 1;      // 待激活／待验证：创建后等待审核或激活的状态
    ACTIVE = 2;       // 正常启用状态：群组正常运行中，可以进行成员管理和权限分配
    ARCHIVED = 3;     // 被归档，但可查询：群组不再活跃但保留历史数据，成员不允许变更
    DISABLED = 4;     // 禁用，不可查询：群组被临时停用，通常为人工操作结果
  }
  Status status = 4;

  // DisplayName 前端展示名称，根据用户的语言环境，自动转换为相应区域的语言说明
  // 用于群组名称的多语言显示，提升群组管理的用户体验和可读性
  string display_name = 5;
  // SortOrder 群组排序顺序，用于同级群组的显示顺序
  // 数值越小排序越靠前，建议使用 10 的倍数便于后续插入
  // 默认值：100，范围：1-9999
  int32 sort_order = 6;
  // ParentID 父群组ID，用于支持群组嵌套，为0表示顶级群组，支持树形组织结构
  int64 parent_id = 7;
  // MaxMembers 群组最大成员数量限制，0表示不限制
  int32 max_members = 8;
  // Metadata 元数据，用于存储自定义属性，支持业务扩展
  map<string, string> metadata = 9;
  // DepartmentID 部门ID，用于与部门的联动
  int64 department_id = 10;
  // ExternalID 外部系统ID，用于与外部系统集成，实现跨系统用户组同步
  string external_id = 11;
  // Description 群组描述，详细说明群组的目的和用途
  string description = 12;
  // CreatedBy 群组创建者/所有者ID，记录创建该群组的用户
  int64 created_by = 13;
  // UpdatedBy 群组最后更新者，记录最后修改该群组的用户
  int64 updated_by = 14;
  // CreatedAt 创建时间，记录群组的创建时间戳
  google.protobuf.Timestamp created_at = 15;
  // UpdatedAt 更新时间，记录群组的最后修改时间戳
  google.protobuf.Timestamp updated_at = 16;
  // DeleteAt 删除时间，用于软删除机制，记录群组标记为删除的时间
  google.protobuf.Timestamp deleted_at = 17;
}

// GroupMember 群组成员关系
// 该模型用于描述用户与群组之间的关联关系，支持多状态管理和角色定义
message GroupMember {
  // ID 群组成员关系 ID，全局唯一标识
  int64 id = 1;
  // UserID 用户 ID，关联用户表
  int64 user_id = 2;
  // Username 用户名，来自用户表
  string username = 3;
  // Nickname 用户昵称，来自用户表
  string nickname = 4;
  // GroupID 群组 ID，关联群组表
  int64 group_id = 5;

  // Role 用户在群组中的角色
  // 用户在群组中的角色枚举
  enum Role {
    ROLE_UNSPECIFIED = 0;  // 默认值/未指定
    OWNER = 1;        // 所有者：拥有群组最高权限
    ADMIN = 2;        // 管理员：管理群组成员和基本设置
    MEMBER = 3;       // 普通成员：拥有基本访问权限
    GUEST = 4;        // 访客：拥有受限访问权限
  }
  Role member_role = 6;

  // Status 群组成员关系状态
  // 群组成员关系状态
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 默认值／未知状态：系统默认值，通常不直接使用
    PENDING = 1;      // 待激活／待验证：用户申请加入群组等待审批
    ACTIVE = 2;       // 正常启用状态：用户正式加入群组
    INVITED = 3;      // 被邀请加入：用户收到群组邀请但尚未回应
    DISABLED = 4;     // 禁用（人工停用）：用户被临时限制群组权限
    REJECTED = 5;     // 被拒绝加入：用户申请或邀请被拒绝
    LEFT = 6;         // 已退出：用户主动退出群组
  }
  Status member_status = 7;

  // JoinedAt 用户加入群组的时间
  google.protobuf.Timestamp joined_at = 8;
  // ExpiredAt 关系有效期，用于临时成员管理，0表示永久有效
  google.protobuf.Timestamp expired_at = 9;
  // CreatedBy 创建者 ID，记录创建该关系的用户
  int64 created_by = 10;
  // UpdatedBy 最后更新者 ID，记录最后修改该关系的用户
  int64 updated_by = 11;
  // CreatedAt 创建时间，记录关系的创建时间戳
  google.protobuf.Timestamp created_at = 12;
  // UpdatedAt 更新时间，记录关系的最后修改时间戳
  google.protobuf.Timestamp updated_at = 13;
  // Metadata 元数据，用于存储自定义属性，支持业务扩展
  map<string, string> metadata = 15;
  // Description 群组描述，详细说明群组的目的和用途
  string description = 16;
}

// DepartmentMember 部门成员关系实体，支持企业级组织管理
// 用于描述用户与部门之间的多对多关系，支持复杂的角色层级、状态管理、
// 审计追踪、汇报关系等企业级功能，满足大型组织的精细化管理需求
message DepartmentMember {
  // ID 部门成员关系唯一标识符，系统自动生成
  // 用于数据库主键和关系追踪，支持历史记录查询
  int64 id = 1;

  // UserID 用户唯一标识符，建立与用户实体的关联
  // 支持一个用户在多个部门中拥有不同角色和权限
  int64 user_id = 2;

  // Username 用户名，用于快速识别和显示
  // 冗余字段，避免频繁关联查询，提升查询性能
  // 建议与用户主表保持同步更新
  string username = 3;

  // Nickname 用户昵称或显示名称，用于友好的界面展示
  // 支持中文名称、英文名称等多种显示格式
  // 用于组织架构图、通讯录等场景的显示
  string nickname = 4;

  // DepartmentID 部门唯一标识符，建立与部门实体的关联
  // 支持用户在多个部门中的复杂组织关系
  int64 department_id = 5;

  // Role 部门角色枚举，定义用户在部门中的职责和权限层级
  // 支持角色继承和权限控制，可用于业务逻辑判断
  // 角色变更需要审批流程和历史记录追踪
  enum Role {
    ROLE_UNSPECIFIED = 0;  // 未指定角色（系统默认值）
    OWNER = 1;        // 部门负责人 - 拥有部门最高管理权限
    DEPUTY = 2;       // 副负责人 - 协助负责人管理部门，拥有大部分管理权限
    MANAGER = 3;      // 经理 - 负责具体业务管理和团队领导
    SUPERVISOR = 4;   // 主管 - 负责日常业务监督和指导
    LEAD = 5;         // 组长 - 负责小组或项目的直接管理
    SENIOR = 6;       // 高级成员 - 资深员工，可能承担指导职责
    MEMBER = 7;       // 普通成员 - 标准部门员工
    INTERN = 8;       // 实习生 - 临时学习和工作的人员
    CONSULTANT = 9;   // 顾问 - 提供专业建议和指导的外部专家
    CONTRACTOR = 10;  // 外包人员 - 临时合作的外部工作人员
    ASSISTANT = 11;   // 助理 - 提供行政和事务支持的人员
  }
  Role member_role = 6;

  // Status 成员状态枚举，管理用户在部门中的生命周期状态
  // 支持状态流转和业务流程控制
  // 状态变更会影响用户的访问权限和业务操作
  enum Status {
    STATUS_UNSPECIFIED = 0;  // 未指定状态（系统默认值）
    ACTIVE = 1;       // 正常状态 - 用户正常工作，拥有完整权限
    DISABLED = 2;     // 已禁用 - 临时禁用，保留关系但无法访问
    LEFT = 3;         // 已离开 - 用户已离职或调离，保留历史记录
    PENDING = 4;      // 待加入 - 申请中或等待审批的状态
    SUSPENDED = 5;    // 暂停 - 临时暂停工作，如休假、停职等
    TRANSFERRING = 6; // 调动中 - 正在进行部门间调动的过渡状态
  }
  Status member_status = 7;

  // CreatedBy 创建者用户ID，记录是谁添加了这个部门成员关系
  // 用于审计追踪、权限验证、责任确认等合规场景
  // 在批量导入时可能为系统管理员ID
  int64 created_by = 8;

  // UpdatedBy 最后更新者用户ID，记录最近一次修改的操作人
  // 用于变更追踪、责任确认、审计日志等场景
  int64 updated_by = 9;

  // ExpiredAt 关系到期时间，支持临时性的部门成员关系
  // 用于项目组、临时调配、实习期等有时限的组织关系
  // 到期后系统可自动调整状态或发送提醒
  // google.protobuf.Timestamp expired_at = 8;

  // CreatedAt 关系创建时间，记录用户加入部门的时间
  // 用于统计分析、考勤计算、工龄统计等业务场景
  google.protobuf.Timestamp created_at = 10;

  // UpdatedAt 关系最后更新时间，记录最近一次修改的时间
  // 用于数据同步、缓存失效、变更追踪等技术场景
  google.protobuf.Timestamp updated_at = 11;

  // Metadata 扩展元数据，存储自定义业务属性
  // 键值对格式，支持灵活的业务扩展需求
  // 示例：{"seat_number": "A-101", "phone_ext": "8001", "skill_tags": "Java,Python"}
  map<string, string> metadata = 12;

  // Description 详细说明信息，描述用户在部门中的具体职责
  // 用于职责说明、工作内容描述、特殊安排说明等
  // 建议长度：500 字符以内，支持富文本格式
  string description = 13;

  // ApprovedBy 审批者用户ID，记录批准该成员关系的管理者
  // 用于审批流程追踪、权限验证、合规管理等场景
  // 在自动加入的情况下可能为空或系统ID
  // int32 approved_by = 15;

  // ApprovedAt 审批时间，记录成员关系被正式批准的时间
  // 用于审批流程管理、生效时间控制、合规追踪等场景
  // google.protobuf.Timestamp approved_at = 16;

  // IsPrimaryDepartment 是否为用户的主部门标识
  // true: 主部门（用户的主要工作部门，影响薪资、考勤等）
  // false: 兼职部门（用户的兼职或协作部门）
  // 一个用户只能有一个主部门，但可以有多个兼职部门
  // MemberType 成员关系类型，区分主部门和兼职部门
  enum MemberType {
    TYPE_UNSPECIFIED = 0;  // 未指定
    PRIMARY = 1;      // 主部门/主成员 - 用户的主要工作、汇报、考勤部门
    DUAL = 2;         // 兼职部门/次要成员 - 协作、项目或次要行政隶属
    ADVISORY = 3;     // 顾问关系/临时关系 - 仅提供指导或临时服务的关系
  }
  MemberType member_type = 17;
  // 【系统约束】：针对同一个 UserID，只能有一个 DepartmentMember 记录的 MemberType 为 TYPE_PRIMARY。
  // bool is_primary_department = 17;
  
  // StartDate 在该部门的开始工作时间，可能与创建时间不同
  // 用于工龄计算、绩效评估、薪资调整等HR业务场景
  // 支持预设生效时间和批量调整场景
  // google.protobuf.Timestamp start_date = 18;
  
  // EndDate 在该部门的结束工作时间，用于离职或调离记录
  // 非空表示已结束关系，空值表示当前仍在该部门
  // 用于历史记录保存和数据归档管理
  // google.protobuf.Timestamp end_date = 19;

  // PositionTitle 职位名称，描述用户在部门中的具体职位
  // 示例："高级软件工程师"、"产品经理"、"财务专员"
  // 用于组织架构展示、职业发展规划、薪资管理等场景
  // string position_title = 20;
  
  // PositionLevel 职级等级，数值化的职位层级
  // 范围：1-20，数值越大级别越高
  // 用于薪资体系、晋升管理、权限控制等场景
  // int32 position_level = 21;
  
  // EmployeeID 员工工号，企业内部的唯一员工标识
  // 格式：企业自定义，如 "EMP001234"、"2024001"
  // 用于考勤系统、薪资系统、ERP系统等的数据对接
  // string employee_id = 22;

  // DirectManagerID 直接上级用户ID，建立汇报关系
  // 用于组织架构管理、审批流程、权限继承等场景
  // 支持矩阵式管理和复杂的汇报关系
  // int64 direct_manager_id = 23;
  
  // Permissions 在该部门的具体权限列表，细粒度权限控制
  // 格式：权限代码数组，如 ["dept.read", "dept.member.manage"]
  // 用于RBAC权限控制、功能访问限制、数据安全等场景
  // repeated string permissions = 24;
  
  // AccessLevel 访问级别，数值化的权限等级
  // 范围：1-10，数值越大权限越高
  // 用于简化权限判断、快速权限过滤等场景
  // int32 access_level = 25;

  // CostCenter 成本中心编码，可能与部门成本中心不同
  // 用于个人成本归集、项目成本分摊、财务核算等场景
  // 支持矩阵式组织中的复杂成本分配
  // string cost_center = 26;
  
  // WorkLocation 工作地点，描述用户的主要工作场所
  // 示例："北京总部"、"上海分公司"、"远程办公"
  // 用于办公管理、差旅报销、资产分配等场景
  // string work_location = 27;
  
  // IsFullTime 是否全职工作标识
  // true: 全职员工，false: 兼职员工
  // 用于薪资计算、福利分配、工时管理等HR场景
  // bool is_full_time = 28;
  
  // WorkSchedule 工作时间安排，描述工作时间模式
  // 示例："9:00-18:00"、"弹性工作制"、"轮班制A"
  // 用于考勤管理、排班安排、工时统计等场景
  // string work_schedule = 29;
}

// AuthProvider 身份提供商实体，验证用户登录时使用的第三方服务
message AuthProvider {
  // ID 全局唯一标识
  int64 id = 1;
  // Name 身份提供商名称，全局唯一
  string code = 2;

  // Type 身份提供商类型
  enum Type {
    TYPE_UNSPECIFIED = 0;
    LOCAL = 1;
    LDAP = 2;
    OIDC = 3;
    OAUTH2 = 4;
    GITHUB = 5;
    GOOGLE = 6;
    WECHAT = 7;
  }
  Type type = 3;

  // ClientID 身份提供商客户端 ID
  string client_id = 4;
  // ClientSecret 身份提供商客户端密钥
  string client_secret = 5;
  // Enabled 身份提供商是否启用
  bool enabled = 6;
  // RedirectURI 身份提供商回调地址
  string redirect_uri = 7;
  // Scopes 身份提供商授权范围
  string scopes = 8;
  // Issuer 身份提供商标识
  string issuer = 9;
  // 身份提供商授权端点
  string authorization_endpoint = 10;
  // 身份提供商令牌端点
  string token_endpoint = 11;
  // 身份提供商用户信息端点
  string userinfo_endpoint = 12;
}

// 企业级通用凭证定义
// 支持 API Key、X.509 证书、非对称密钥对、HMAC/对称密钥、JWKS、软件许可证等多种凭证类型
// 提供分层管理：类型、算法、用途、可见性、来源、策略、审计和元数据
message Credential {
  // API 密钥结构
  message ApiKeyData {
    string api_key = 1;    // API Key 的公有标识
    bytes api_secret = 2;  // API Secret / 私密部分，敏感数据
  }

  // 非对称密钥对
  message KeyPairData {
    bytes public_key = 1;   // 公钥内容（PEM/DER 格式）
    bytes private_key = 2;  // 私钥内容（PEM/DER 格式），敏感数据
    bytes passphrase = 3;   // 私钥加密口令，可选
  }

  // X.509 证书捆绑数据
  message X509Data {
    bytes certificate = 1;       // 主证书（PEM/DER 格式）
    bytes private_key = 2;       // 对应私钥（PEM/DER 格式），敏感数据，可选
    repeated bytes ca_chain = 3; // 可选 CA 证书链（顺序从根到中间证书）
  }

  // 软件许可证
  message LicenseData {
    string license_key = 1;  // 许可证密钥或主体内容
    string signature = 2;    // 许可证数字签名，用于验证完整性
  }

  // 凭证类型（载体/结构）
  enum Type {
    TYPE_UNSPECIFIED = 0;     // 未指定类型
    API_KEY = 1;         // API Key
    SYMMETRIC_KEY = 2;   // 对称密钥 / HMAC / AES
    KEY_PAIR = 3;        // 公私钥对
    X509 = 4;            // X.509 证书凭证（包含主证书、私钥、CA链）
    LICENSE = 5;         // 软件许可证
    JWKS = 6;            // JSON Web Key Set URI / 内容
    HSM_REF = 7;         // 外部安全模块 (KMS/HSM) 引用
    FIDO = 8;            // 硬件安全密钥 / 多因素认证设备
    // OTHER = 99;          // 未来扩展自定义类型
  }

  // 算法类型枚举
  enum Algorithm {
    ALGORITHM_UNSPECIFIED = 0; // 未指定

    // 非对称签名/加密算法
    RSA = 1;          // RSA 公私钥算法
    ECDSA = 2;        // ECDSA 椭圆曲线签名算法
    ED25519 = 3;      // Ed25519 高性能椭圆曲线签名算法

    // 对称签名 / HMAC
    HMAC = 4;         // HMAC 对称签名算法，hash 类型可在 metadata 指定 (SHA256, SHA512, SHA3 等)

    // 对称加密算法
    AES = 5;          // AES 对称加密算法，可在 metadata 指定 key 长度 (128/256) 和模式 (GCM/CBC 等)
    CHACHA20_POLY1305 = 6; // ChaCha20-Poly1305 对称加密 + 完整性验证，高性能

    // 国密 / 自定义算法
    // OTHER = 99;       // 自定义算法或国密算法（如 SM2/SM3/SM4 或企业自研算法）
  }

  // 凭证用途
  enum Usage {
    USAGE_UNSPECIFIED = 0; // 未指定用途

    // 技术用途
    SIGNING = 1;     // 数据签名/完整性验证
    ENCRYPTION = 2;  // 数据加密/解密

    // 业务用途
    AUTH = 10;        // 身份认证/授权
    // LICENSE = 11;     // 软件许可证验证
    OTP = 12;         // 一次性密码 / TOTP
  }

  // 凭证状态
  enum Status {
    STATUS_UNSPECIFIED = 0; // 未指定状态
    ACTIVE = 1;      // 有效且正在使用
    PENDING = 2;     // 待激活/待验证
    DISABLED = 3;    // 手动禁用
    EXPIRED = 4;     // 已过期
    REVOKED = 5;     // 已吊销/废弃
  }

  // 凭证来源
  enum Source {
    SOURCE_UNSPECIFIED = 0; // 未指定
    SYSTEM = 1;      // 系统自动生成
    USER = 2;        // 用户创建
    KMS = 3;         // KMS/HSM 生成
    EXTERNAL = 4;    // 外部导入
  }

  int64 id = 1;             // 凭证唯一 ID
  string code = 2;          // 凭证显示名称

  Type type = 3;             // 凭证类型
  Algorithm algorithm = 4;   // 技术算法
  Usage usage = 5;           // 业务用途
  Visibility visibility = 6; // 可见性
  Status status = 7;         // 当前状态
  Source source = 8;         // 凭证来源

  string key_id = 9;         // 外部系统 Key ID / JWKS ID / HSM ID

  // oneof: 核心密钥材料（互斥存储）
  oneof key_material {
    ApiKeyData api_key = 10;                // API Key
    KeyPairData key_pair = 11;              // 公私钥对
    X509Data x509_data = 12;   // X.509 证书数据
    LicenseData license = 13;                // 软件许可证
    bytes symmetric_key = 14;              // 对称密钥 / HMAC / JWT
    string jwks_uri = 15;                    // JWKS URI
  }

  // 时间相关字段
  google.protobuf.Timestamp not_before = 17; // 生效时间（Not Before）
  google.protobuf.Timestamp expires_at = 18; // 过期时间
  google.protobuf.Timestamp created_at = 19; // 创建时间
  google.protobuf.Timestamp updated_at = 20; // 最后更新时间

  // 审计信息
  int64 created_by = 21; // 创建者用户 ID
  int64 updated_by = 22; // 更新者用户 ID

  // 附加元数据和描述
  map<string, string> metadata = 23; // 自定义业务属性
  string description = 24;           // 凭证说明或备注
}

message OAuth2JSONWebKeys {
  message Key {
    string kty = 1;
    string use = 2;
    string alg = 3;
    string e = 4;
    string n = 5;
    string kid = 6;
  }

  repeated Key keys = 1;
}

message OAuth2Userinfo {
  // ID 用户 ID，全局唯一标识，使用 int64 序列化为 json 为 string 类型
  int64 user_id = 1;
  // 用户名，系统登录凭证，必须唯一
  string username = 2;
  // 昵称，用于社交或前端展示
  string nickname = 3;
  // 个人简介或签名
  string profile = 4;
  // 用户头像 URL
  string picture = 5;
  // 个人网站地址
  string website = 6;
  // 时区信息（IANA 时区标识，例如 "Asia/Shanghai"）
  string timezone = 7;
  // 用户偏好的语言与地区（例如 "zh-CN"、"en-US"）
  string locale = 8;  
}

// AuthToken 登录成功响应
// 参考 rfc 规范：https://www.rfc-editor.org/rfc/rfc6749#section-5
message AuthToken {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
}